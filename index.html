<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZArchiver Web Explorer 📁</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #ffb74d; margin: 0; font-size: 22px; }
    .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn:hover { background: #444; }
    .btn-drive { background: #4285f4; border: none; font-weight: bold; }
    .btn-drive:hover { background: #3367d6; }
    .btn-action { background: #ffb74d; color: #121212; border: none; font-weight: bold; }
    .btn-action:hover { background: #ffa726; }
    
    /* File Explorer Layout */
    .explorer-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .file-list { background: #2a2a2a; border-radius: 8px; border: 1px solid #333; min-height: 250px; max-height: 400px; overflow-y: auto; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #333; cursor: pointer; }
    .file-item:hover { background: #333; }
    .file-info { display: flex; align-items: center; gap: 10px; }
    .file-icon { font-size: 18px; }
    
    /* Operations Panel */
    .panel { background: #252525; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
    .size-group { display: flex; gap: 10px; margin: 10px 0; }
    .size-group input { flex: 2; padding: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; }
    .size-group select { flex: 1; padding: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; }
    .status { margin-top: 10px; font-size: 13px; color: #81c784; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ZArchiver Web Explorer 📁</h1>
    <div>
      <button class="btn btn-drive" onclick="connectGoogleDrive()">🔗 ربط Google Drive</button>
    </div>
  </header>

  <!-- شريط التحكم بالملفات -->
  <div class="explorer-bar">
    <button class="btn" onclick="openLocalFolder()">📂 فتح مجلد من الجهاز</button>
    <button class="btn" id="pasteBtn" onclick="pasteFile()" disabled>📋 Paste (لصق)</button>
  </div>

  <!-- عرض قائمة الملفات والمجلدات -->
  <div class="file-list" id="fileList">
    <div style="padding: 20px; text-align: center; color: #aaa;">اضغطي على "فتح مجلد من الجهاز" لاستكشاف الملفات</div>
  </div>

  <!-- لوحة عمليات التقسيم والدمج -->
  <div class="panel">
    <h3 style="margin-top: 0; color: #64b5f6;">أدوات التقسيم والدمج</h3>
    <label>حدد حجم التقسيم للملف المحدد:</label>
    <div class="size-group">
      <input type="number" id="chunkSize" value="500" min="1" step="any">
      <select id="unitSelect">
        <option value="bit">بت (Bit)</option>
        <option value="B">بايت (Byte)</option>
        <option value="KB">كيلوبايت (KB)</option>
        <option value="MB" selected>ميجابايت (MB)</option>
        <option value="GB">جيجابايت (GB)</option>
        <option value="TB">تيرا بايت (TB)</option>
      </select>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-action" style="flex: 1;" onclick="splitSelectedFile()">تقسيم الملف المحدد</button>
      <button class="btn btn-action" style="flex: 1;" onclick="mergeSelectedFiles()">دمج الأجزاء المحددة</button>
    </div>
    <div id="statusText" class="status"></div>
  </div>
</div>

<script>
  let currentDirHandle = null;
  let fileEntries = [];
  let clipboardFileHandle = null;

  // 1. فتح مجلد محلي بالكامل باستعمال File System Access API
  async function openLocalFolder() {
    try {
      currentDirHandle = await window.showDirectoryPicker();
      await refreshFileList();
    } catch (err) {
      console.log('تم إلغاء اختيار المجلد أو المتصفح لا يدعم الميزة');
    }
  }

  // تحديث قائمة الملفات في الواجهة
  async function refreshFileList() {
    if (!currentDirHandle) return;
    const fileListDiv = document.getElementById('fileList');
    fileListDiv.innerHTML = '';
    fileEntries = [];

    for await (const entry of currentDirHandle.values()) {
      fileEntries.push(entry);
      const item = document.createElement('div');
      item.className = 'file-item';
      
      const icon = entry.kind === 'directory' ? '📁' : '📄';
      
      item.innerHTML = `
        <div class="file-info">
          <span class="file-icon">${icon}</span>
          <span>${entry.name}</span>
        </div>
        <div>
          ${entry.kind === 'file' ? `<button class="btn" onclick="copyFile('${entry.name}', event)">Copy</button>` : ''}
        </div>
      `;
      
      fileListDiv.appendChild(item);
    }
  }

  // 2. عمليات Copy & Paste
  async function copyFile(fileName, event) {
    event.stopPropagation();
    clipboardFileHandle = await currentDirHandle.getFileHandle(fileName);
    document.getElementById('pasteBtn').disabled = false;
    document.getElementById('statusText').innerText = `تم نسخ ${fileName} إلى الحافظة.`;
  }

  async function pasteFile() {
    if (!clipboardFileHandle || !currentDirHandle) return;
    const file = await clipboardFileHandle.getFile();
    const newFileHandle = await currentDirHandle.getFileHandle(`نسخة_${file.name}`, { create: true });
    const writable = await newFileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    
    document.getElementById('statusText').innerText = `تم لصق الملف بنجاح!`;
    await refreshFileList();
  }

  // 3. تقسيم الملف المحدد
  async function splitSelectedFile() {
    if (!fileEntries.length) {
      alert("الرجاء فتح مجلد واختيار ملف أولاً!");
      return;
    }
    
    // البحث عن أول ملف في القائمة للتجربة
    const fileEntry = fileEntries.find(e => e.kind === 'file');
    if (!fileEntry) return alert("لا يوجد ملفات لتقسيمها في المجلد الحالي!");

    const file = await fileEntry.getFile();
    const sizeValue = parseFloat(document.getElementById('chunkSize').value);
    const unit = document.getElementById('unitSelect').value;

    let chunkSizeInBytes = sizeValue;
    if (unit === 'bit') chunkSizeInBytes = sizeValue / 8;
    else if (unit === 'B') chunkSizeInBytes = sizeValue;
    else if (unit === 'KB') chunkSizeInBytes = sizeValue * 1024;
    else if (unit === 'MB') chunkSizeInBytes = sizeValue * 1024 * 1024;
    else if (unit === 'GB') chunkSizeInBytes = sizeValue * 1024 * 1024 * 1024;
    else if (unit === 'TB') chunkSizeInBytes = sizeValue * 1024 * 1024 * 1024 * 1024;

    let offset = 0;
    let partNum = 1;

    document.getElementById('statusText').innerText = "جاري التقسيم وتطوير الأجزاء داخل المجلد...";

    while (offset < file.size) {
      const chunk = file.slice(offset, offset + chunkSizeInBytes);
      const partName = `${file.name}.part${String(partNum).padStart(3, '0')}`;
      
      // كتابة الجزء مباشرة في المجلد
      const partHandle = await currentDirHandle.getFileHandle(partName, { create: true });
      const writable = await partHandle.createWritable();
      await writable.write(chunk);
      await writable.close();

      offset += chunkSizeInBytes;
      partNum++;
    }

    document.getElementById('statusText').innerText = `تم تقسيم ${file.name} بنجاح إلى ${partNum - 1} أجزاء!`;
    await refreshFileList();
  }

  // 4. الربط مع Google Drive API
  function connectGoogleDrive() {
    alert("لربط Google Drive الكامل على الويب، يلزم إضافة Client ID الخاص بـ OAuth2 من Google Cloud Console لقراءة ملفات الحساب مباشرة.");
  }
</script>

</body>
</html>
