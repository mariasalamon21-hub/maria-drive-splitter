<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maria Drive Splitter</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .drop-zone {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .drop-zone:hover {
      border-color: #4f46e5;
      background: #f8f7ff;
    }

    input[type="file"] {
      display: none;
    }

    .size-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      align-items: center;
    }

    .size-row input {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    .size-row select {
      width: 110px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .progress-container {
      margin-top: 20px;
      display: none;
    }

    .progress {
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      transition: width .2s;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #4b5563;
    }

    .part {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .part button {
      width: auto;
      margin: 0;
      padding: 8px 14px;
    }

    .note {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
    }

    .success {
      color: #16a34a;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Maria Drive Splitter</h1>

  <div class="subtitle">
    Split your file into the exact size you choose
  </div>

  <!-- FILE CARD -->
  <div class="card">

    <label class="drop-zone" for="fileInput">
      <strong>Choose your file</strong>
      <br><br>
      Click here to select a video or any large file
      <br><br>
      <span id="fileName">No file selected</span>
    </label>

    <input id="fileInput" type="file">

    <div class="size-row">

      <input
        id="partSize"
        type="number"
        min="1"
        step="1"
        placeholder="Enter size"
      >

      <select id="unit">
        <option value="MB" selected>MB</option>
        <option value="GB">GB</option>
      </select>

    </div>

    <button id="startButton" disabled>
      Split File
    </button>

    <div class="progress-container" id="progressContainer">

      <div class="progress">
        <div
          class="progress-bar"
          id="progressBar">
        </div>
      </div>

      <div
        class="status"
        id="status">
        Preparing...
      </div>

    </div>

  </div>


  <!-- PARTS CARD -->
  <div
    class="card"
    id="partsCard"
    style="display:none">

    <h2>Parts</h2>

    <div id="partsList"></div>

    <button id="downloadAll">
      Download All Parts
    </button>

  </div>


  <!-- GOOGLE DRIVE CARD -->
  <div class="card">

    <h2>Google Drive</h2>

    <p class="note">
      The original file stays on your computer.
      The file is processed locally in your browser.
      Google Drive authorization is required before uploading.
    </p>

    <button id="googleButton">
      Connect Google Drive
    </button>

    <div
      id="driveStatus"
      class="status">
    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE DRIVE CONFIGURATION
   ========================================================= */

const GOOGLE_CLIENT_ID =
  "304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com";

const DRIVE_SCOPE =
  "https://www.googleapis.com/auth/drive.file";

let googleTokenClient = null;
let accessToken = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const fileInput =
  document.getElementById("fileInput");

const fileName =
  document.getElementById("fileName");

const partSizeInput =
  document.getElementById("partSize");

const unit =
  document.getElementById("unit");

const startButton =
  document.getElementById("startButton");

const progressContainer =
  document.getElementById("progressContainer");

const progressBar =
  document.getElementById("progressBar");

const status =
  document.getElementById("status");

const partsCard =
  document.getElementById("partsCard");

const partsList =
  document.getElementById("partsList");

const downloadAll =
  document.getElementById("downloadAll");

const googleButton =
  document.getElementById("googleButton");

const driveStatus =
  document.getElementById("driveStatus");


let selectedFile = null;
let parts = [];


/* =========================================================
   GOOGLE AUTHORIZATION
   ========================================================= */

function initializeGoogleAuth() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {
    driveStatus.textContent =
      "Google authorization is still loading. Please wait a moment.";

    driveStatus.className = "status";

    setTimeout(initializeGoogleAuth, 500);

    return;
  }


  googleTokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: GOOGLE_CLIENT_ID,

      scope: DRIVE_SCOPE,

      callback: (response) => {

        if (response.error) {

          console.error(response);

          driveStatus.textContent =
            "Google authorization failed.";

          driveStatus.className =
            "status error";

          return;
        }


        accessToken =
          response.access_token;


        driveStatus.textContent =
          "✓ Google Drive connected successfully.";

        driveStatus.className =
          "status success";


        googleButton.textContent =
          "Google Drive Connected";

        googleButton.disabled = true;

      }

    });

}


/* =========================================================
   GOOGLE BUTTON
   ========================================================= */

googleButton.addEventListener(
  "click",
  () => {

    if (!googleTokenClient) {

      driveStatus.textContent =
        "Google authorization is still loading. Please wait.";

      return;

    }


    driveStatus.textContent =
      "Opening Google authorization...";


    googleTokenClient.requestAccessToken({
      prompt: "consent"
    });

  }
);


/* =========================================================
   FILE SELECTION
   ========================================================= */

fileInput.addEventListener(
  "change",
  () => {

    selectedFile =
      fileInput.files[0];


    if (!selectedFile) {

      startButton.disabled = true;

      fileName.textContent =
        "No file selected";

      return;
    }


    fileName.textContent =
      selectedFile.name +
      " — " +
      formatBytes(selectedFile.size);


    startButton.disabled = false;

  }
);


/* =========================================================
   SPLIT
   ========================================================= */

startButton.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {
      return;
    }


    const enteredSize =
      Number(partSizeInput.value);


    if (
      !enteredSize ||
      enteredSize <= 0
    ) {

      alert(
        "Please enter a valid part size."
      );

      return;
    }


    let bytesPerPart;


    if (unit.value === "MB") {

      bytesPerPart =
        enteredSize *
        1024 *
        1024;

    } else {

      bytesPerPart =
        enteredSize *
        1024 *
        1024 *
        1024;

    }


    if (
      bytesPerPart >=
      selectedFile.size
    ) {

      alert(
        "The part size must be smaller than the original file."
      );

      return;
    }


    parts = [];

    partsList.innerHTML = "";

    partsCard.style.display = "none";

    progressContainer.style.display = "block";

    progressBar.style.width = "0%";

    startButton.disabled = true;


    const totalParts =
      Math.ceil(
        selectedFile.size /
        bytesPerPart
      );


    for (
      let i = 0;
      i < totalParts;
      i++
    ) {

      const start =
        i * bytesPerPart;


      const end =
        Math.min(
          start + bytesPerPart,
          selectedFile.size
        );


      const blob =
        selectedFile.slice(
          start,
          end
        );


      const number =
        String(i + 1)
          .padStart(3, "0");


      const base =
        removeExtension(
          selectedFile.name
        );


      const extension =
        getExtension(
          selectedFile.name
        );


      const name =
        `${base}.part${number}.${extension}`;


      parts.push({
        name: name,
        blob: blob,
        size: blob.size
      });


      const percent =
        ((i + 1) / totalParts) *
        100;


      progressBar.style.width =
        percent + "%";


      status.textContent =
        `Creating part ${i + 1} of ${totalParts}...`;


      await sleep(0);

    }


    status.textContent =
      `${parts.length} parts created successfully.`;


    showParts();


    startButton.disabled = false;

  }
);


/* =========================================================
   SHOW PARTS
   ========================================================= */

function showParts() {

  partsCard.style.display =
    "block";


  partsList.innerHTML =
    "";


  parts.forEach(
    (part, index) => {

      const row =
        document.createElement("div");


      row.className =
        "part";


      const info =
        document.createElement("div");


      info.innerHTML =
        `<strong>${escapeHtml(part.name)}</strong>
        <br>
        <small>${formatBytes(part.size)}</small>`;


      const button =
        document.createElement("button");


      button.textContent =
        "Download";


      button.onclick =
        () => downloadPart(index);


      row.appendChild(info);

      row.appendChild(button);

      partsList.appendChild(row);

    }
  );

}


/* =========================================================
   DOWNLOAD ONE PART
   ========================================================= */

function downloadPart(index) {

  const part =
    parts[index];


  const url =
    URL.createObjectURL(
      part.blob
    );


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    part.name;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    10000
  );

}


/* =========================================================
   DOWNLOAD ALL
   ========================================================= */

downloadAll.addEventListener(
  "click",
  async () => {

    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      downloadPart(i);

      await sleep(1200);

    }

  }
);


/* =========================================================
   HELPERS
   ========================================================= */

function formatBytes(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    (
      bytes /
      Math.pow(1024, i)
    ).toFixed(2)
    +
    " "
    +
    units[i]
  );

}


function getExtension(name) {

  const pieces =
    name.split(".");


  if (pieces.length === 1) {
    return "bin";
  }


  return pieces.pop();

}


function removeExtension(name) {

  const index =
    name.lastIndexOf(".");


  if (index === -1) {
    return name;
  }


  return name.substring(
    0,
    index
  );

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/* =========================================================
   START GOOGLE INITIALIZATION
   ========================================================= */

window.addEventListener(
  "load",
  () => {

    initializeGoogleAuth();

  }
);

</script>

</body>
</html>
