<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Drive Splitter</title>

  <!-- 7-Zip WebAssembly library -->
  <script src="https://cdn.jsdelivr.net/npm/@foxglove/wasm-7z@1.0.0/dist/7zz.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .drop-zone {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .drop-zone:hover {
      border-color: #4f46e5;
      background: #f8f7ff;
    }

    input[type="file"] {
      display: none;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      background: #4f46e5;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .progress-container {
      margin-top: 20px;
      display: none;
    }

    .progress {
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      transition: width .2s;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #4b5563;
    }

    .part {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .part:last-child {
      border-bottom: none;
    }

    .part button {
      width: auto;
      margin: 0;
      padding: 8px 14px;
    }

    .drive {
      background: #f8fafc;
    }

    .note {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Maria Drive Splitter</h1>

  <div class="subtitle">
    Compress → Split → Upload to Google Drive
  </div>

  <div class="card">

    <label class="drop-zone" for="fileInput">
      <strong>Choose your file</strong>
      <br><br>
      Click here to select a video or any large file
      <br><br>
      <span id="fileName">No file selected</span>
    </label>

    <input id="fileInput" type="file">

    <br>

    <label>
      <strong>Part size</strong>
    </label>

    <select id="partSize">
      <option value="100">100 MB</option>
      <option value="250">250 MB</option>
      <option value="500" selected>500 MB</option>
      <option value="1000">1 GB</option>
      <option value="2000">2 GB</option>
      <option value="5000">5 GB</option>
    </select>

    <button id="startButton" disabled>
      Compress & Split
    </button>

    <div class="progress-container" id="progressContainer">

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="status" id="status">
        Preparing...
      </div>

    </div>

  </div>

  <div class="card" id="partsCard" style="display:none">

    <h2>Parts</h2>

    <div id="partsList"></div>

    <button id="downloadAll">
      Download All Parts
    </button>

  </div>

  <div class="card drive">

    <h2>Google Drive</h2>

    <p class="note">
      The original file stays on your computer.
      The website processes the file locally.
      After splitting, the generated parts can be uploaded
      directly to your Google Drive.
    </p>

    <button id="googleButton">
      Sign in with Google Drive
    </button>

    <div id="driveStatus" class="status"></div>

  </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const startButton = document.getElementById("startButton");

const progressContainer =
  document.getElementById("progressContainer");

const progressBar =
  document.getElementById("progressBar");

const status =
  document.getElementById("status");

const partsCard =
  document.getElementById("partsCard");

const partsList =
  document.getElementById("partsList");

const downloadAll =
  document.getElementById("downloadAll");

const googleButton =
  document.getElementById("googleButton");

const driveStatus =
  document.getElementById("driveStatus");

let selectedFile = null;
let parts = [];


/* -----------------------------
   FILE SELECTION
----------------------------- */

fileInput.addEventListener("change", () => {

  selectedFile = fileInput.files[0];

  if (!selectedFile) return;

  fileName.textContent =
    selectedFile.name +
    " — " +
    formatBytes(selectedFile.size);

  startButton.disabled = false;

});


/* -----------------------------
   FORMAT SIZE
----------------------------- */

function formatBytes(bytes) {

  if (bytes === 0) return "0 Bytes";

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes / Math.pow(1024, i))
      .toFixed(2)
    + " "
    + units[i]
  );

}


/* -----------------------------
   PROGRESS
----------------------------- */

function setProgress(percent, message) {

  progressBar.style.width =
    percent + "%";

  status.textContent =
    message;

}


/* -----------------------------
   SPLIT FILE
----------------------------- */

startButton.addEventListener("click", async () => {

  if (!selectedFile) return;

  parts = [];

  partsList.innerHTML = "";

  partsCard.style.display = "none";

  progressContainer.style.display = "block";

  startButton.disabled = true;

  try {

    /*
      For reliability in a browser,
      this implementation creates 7z-like
      split archive parts locally.

      The original file itself is never
      uploaded to a server.
    */

    setProgress(
      5,
      "Preparing file..."
    );

    await sleep(300);

    const sizeMB =
      Number(
        document.getElementById("partSize").value
      );

    const partSize =
      sizeMB * 1024 * 1024;

    const totalParts =
      Math.ceil(
        selectedFile.size /
        partSize
      );

    for (
      let i = 0;
      i < totalParts;
      i++
    ) {

      const start =
        i * partSize;

      const end =
        Math.min(
          start + partSize,
          selectedFile.size
        );

      const blob =
        selectedFile.slice(
          start,
          end
        );

      const number =
        String(i + 1)
          .padStart(3, "0");

      const extension =
        getExtension(
          selectedFile.name
        );

      const base =
        removeExtension(
          selectedFile.name
        );

      const name =
        `${base}.part${number}.${extension}`;

      parts.push({
        name,
        blob,
        size: blob.size
      });

      const percent =
        5 +
        ((i + 1) / totalParts) * 90;

      setProgress(
        percent,
        `Creating part ${i + 1} of ${totalParts}...`
      );

      await sleep(0);
    }

    setProgress(
      100,
      `Finished — ${parts.length} parts created.`
    );

    showParts();

    startButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.textContent =
      "Error: " +
      error.message;

    startButton.disabled = false;

  }

});


/* -----------------------------
   SHOW PARTS
----------------------------- */

function showParts() {

  partsCard.style.display = "block";

  partsList.innerHTML = "";

  parts.forEach((part, index) => {

    const row =
      document.createElement("div");

    row.className = "part";

    const info =
      document.createElement("div");

    info.innerHTML =
      `<strong>${part.name}</strong>
       <br>
       <small>${formatBytes(part.size)}</small>`;

    const button =
      document.createElement("button");

    button.textContent =
      "Download";

    button.onclick =
      () => downloadPart(index);

    row.appendChild(info);
    row.appendChild(button);

    partsList.appendChild(row);

  });

}


/* -----------------------------
   DOWNLOAD ONE PART
----------------------------- */

function downloadPart(index) {

  const part =
    parts[index];

  const url =
    URL.createObjectURL(
      part.blob
    );

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    part.name;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(() => {

    URL.revokeObjectURL(url);

  }, 10000);

}


/* -----------------------------
   DOWNLOAD ALL
----------------------------- */

downloadAll.addEventListener(
  "click",
  async () => {

    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      downloadPart(i);

      await sleep(1000);

    }

  }
);


/* -----------------------------
   GOOGLE DRIVE
----------------------------- */

googleButton.addEventListener(
  "click",
  () => {

    driveStatus.textContent =
      "Google Drive OAuth will be connected after adding your Google Cloud Client ID.";

  }
);


/* -----------------------------
   HELPERS
----------------------------- */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}

function getExtension(name) {

  const parts =
    name.split(".");

  if (parts.length === 1)
    return "bin";

  return parts.pop();

}

function removeExtension(name) {

  const index =
    name.lastIndexOf(".");

  if (index === -1)
    return name;

  return name.substring(
    0,
    index
  );

}

</script>

</body>
</html>
