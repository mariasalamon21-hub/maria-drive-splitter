<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local File Copy Test</title>
</head>

<body>

<h2>🧪 Local Copy Test</h2>

<p>
  اختاري ملف من جهازك، وبعدها اختاري فولدر تاني.
  الموقع هيعمل Copy مباشر للفولدر، بدون Download.
</p>

<button id="copyBtn">
  📁 Select File & Copy
</button>

<div id="status"></div>

<script>
document.getElementById("copyBtn").addEventListener("click", async () => {

  try {

    // 1. اختيار الملف
    const [fileHandle] =
      await window.showOpenFilePicker({
        multiple: false
      });

    const file =
      await fileHandle.getFile();

    // 2. اختيار فولدر الوجهة
    const folderHandle =
      await window.showDirectoryPicker();

    document.getElementById("status").textContent =
      "Copying...";

    // 3. إنشاء ملف بنفس الاسم في الفولدر
    const newFileHandle =
      await folderHandle.getFileHandle(
        file.name,
        {
          create: true
        }
      );

    // 4. فتح الملف للكتابة
    const writable =
      await newFileHandle.createWritable();

    // 5. نسخ البيانات على أجزاء
    const reader =
      file.stream().getReader();

    let copied = 0;

    while (true) {

      const {
        value,
        done
      } = await reader.read();

      if (done) break;

      await writable.write(value);

      copied += value.byteLength;

      const percent =
        ((copied / file.size) * 100).toFixed(1);

      document.getElementById("status").textContent =
        `Copying... ${percent}% — ` +
        `${formatBytes(copied)} / ${formatBytes(file.size)}`;
    }

    // 6. إنهاء الكتابة
    await writable.close();

    document.getElementById("status").textContent =
      `✅ Done! ${file.name} was copied successfully.`;

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ " + error.message;
  }
});


function formatBytes(bytes) {

  if (bytes === 0) return "0 Bytes";

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) / Math.log(1024)
    );

  return (
    bytes / Math.pow(1024, i)
  ).toFixed(2) +
  " " +
  units[i];
}
</script>

</body>
</html>
