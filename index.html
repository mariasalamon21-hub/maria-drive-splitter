<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maria Drive Splitter</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
    }

    .drop-zone {
      display: block;
      border: 2px dashed #aaa;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .drop-zone:hover {
      border-color: #333;
      background: #fafafa;
    }

    #fileInput {
      display: none;
    }

    #fileName {
      color: #555;
      word-break: break-word;
    }

    .size-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .size-row input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .size-row select {
      width: 120px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .progress-container,
    .upload-progress-container {
      display: none;
      margin-top: 20px;
    }

    .progress {
      width: 100%;
      height: 18px;
      background: #e5e5e5;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #222;
      transition: width 0.1s;
    }

    .status {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
      text-align: center;
      word-break: break-word;
    }

    .part {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .part-name {
      font-weight: bold;
      word-break: break-word;
    }

    .part-size {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .part button {
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }

    .drive-connected {
      background: #2e7d32 !important;
    }

    .upload-file-status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      word-break: break-word;
    }

    .success {
      color: #2e7d32 !important;
      font-weight: bold;
    }

    .error {
      color: #c62828 !important;
      font-weight: bold;
    }

    .note {
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Maria Drive Splitter</h1>

  <div class="subtitle">
    Split your file into the exact size you choose
  </div>


  <!-- FILE -->
  <div class="card">

    <label class="drop-zone" for="fileInput">

      <strong>Choose your file</strong>

      <br><br>

      Click here to select a video or any large file

      <br><br>

      <span id="fileName">
        No file selected
      </span>

    </label>

    <input
      id="fileInput"
      type="file"
    >


    <!-- SIZE -->
    <div class="size-row">

      <input
        id="partSize"
        type="number"
        min="0.000001"
        step="any"
        placeholder="Enter size"
      >

      <select id="unit">

        <option value="bit">bit</option>

        <option value="Byte">Byte</option>

        <option value="KB">KB</option>

        <option value="MB" selected>MB</option>

        <option value="GB">GB</option>

        <option value="TB">TB</option>

      </select>

    </div>


    <button
      id="startButton"
      disabled
    >
      Split File
    </button>


    <!-- SPLIT PROGRESS -->
    <div
      class="progress-container"
      id="progressContainer"
    >

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>

      <div
        class="status"
        id="status"
      >
        Preparing...
      </div>

    </div>

  </div>


  <!-- PARTS -->
  <div
    class="card"
    id="partsCard"
    style="display: none;"
  >

    <h2>Parts</h2>

    <div id="partsList"></div>


    <button id="downloadAll">
      Download All Parts
    </button>


    <button
      id="uploadDriveButton"
      disabled
    >
      Upload Parts to Google Drive
    </button>


    <!-- UPLOAD PROGRESS -->
    <div
      class="upload-progress-container"
      id="uploadProgressContainer"
    >

      <div class="progress">

        <div
          class="progress-bar"
          id="uploadProgressBar"
        ></div>

      </div>

      <div
        class="upload-file-status"
        id="uploadStatus"
      >
        Preparing upload...
      </div>

    </div>

  </div>


  <!-- GOOGLE DRIVE -->
  <div class="card">

    <h2>Google Drive</h2>

    <p class="note">

      The original file stays on your computer.

      The file is processed locally in your browser.

      Google Drive authorization is required before uploading.

    </p>


    <button id="googleButton">
      Connect Google Drive
    </button>


    <div
      id="driveStatus"
      class="status"
    ></div>

  </div>

</div>


<script>

  /* =========================================================
     GOOGLE CONFIG
  ========================================================= */

  const GOOGLE_CLIENT_ID =
    "304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com";

  const DRIVE_SCOPE =
    "https://www.googleapis.com/auth/drive.file";


  let googleTokenClient = null;

  let accessToken = null;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const fileInput =
    document.getElementById("fileInput");

  const fileName =
    document.getElementById("fileName");

  const partSizeInput =
    document.getElementById("partSize");

  const unitSelect =
    document.getElementById("unit");

  const startButton =
    document.getElementById("startButton");

  const progressContainer =
    document.getElementById("progressContainer");

  const progressBar =
    document.getElementById("progressBar");

  const status =
    document.getElementById("status");

  const partsCard =
    document.getElementById("partsCard");

  const partsList =
    document.getElementById("partsList");

  const downloadAllButton =
    document.getElementById("downloadAll");

  const uploadDriveButton =
    document.getElementById("uploadDriveButton");

  const uploadProgressContainer =
    document.getElementById("uploadProgressContainer");

  const uploadProgressBar =
    document.getElementById("uploadProgressBar");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const googleButton =
    document.getElementById("googleButton");

  const driveStatus =
    document.getElementById("driveStatus");


  /* =========================================================
     DATA
  ========================================================= */

  let selectedFile = null;

  let parts = [];


  /* =========================================================
     UNIT CONVERSION
  ========================================================= */

  function convertToBytes(value, unit) {

    const multipliers = {

      bit: 1 / 8,

      Byte: 1,

      KB: 1024,

      MB: 1024 * 1024,

      GB:
        1024 *
        1024 *
        1024,

      TB:
        1024 *
        1024 *
        1024 *
        1024

    };

    return value * multipliers[unit];
  }


  /* =========================================================
     GOOGLE AUTH INITIALIZATION
  ========================================================= */

  function initializeGoogleAuth() {

    if (
      !window.google ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      setTimeout(
        initializeGoogleAuth,
        500
      );

      return;
    }


    googleTokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:
          GOOGLE_CLIENT_ID,

        scope:
          DRIVE_SCOPE,

        callback:
          (response) => {

            if (response.error) {

              console.error(response);

              driveStatus.textContent =
                "Google authorization failed.";

              driveStatus.className =
                "status error";

              return;
            }


            accessToken =
              response.access_token;


            googleButton.textContent =
              "Google Drive Connected";


            googleButton.classList.add(
              "drive-connected"
            );


            driveStatus.textContent =
              "Google Drive is connected. You can now upload your parts.";

            driveStatus.className =
              "status success";


            updateUploadButton();

          }

      });

  }


  /* =========================================================
     GOOGLE BUTTON
  ========================================================= */

  googleButton.addEventListener(
    "click",
    () => {

      if (!googleTokenClient) {

        driveStatus.textContent =
          "Google is still loading. Please wait.";

        return;
      }


      googleTokenClient.requestAccessToken({

        prompt: "consent"

      });

    }
  );


  /* =========================================================
     FILE SELECT
  ========================================================= */

  fileInput.addEventListener(
    "change",
    () => {

      selectedFile =
        fileInput.files[0];


      if (!selectedFile) {

        fileName.textContent =
          "No file selected";

        startButton.disabled =
          true;

        return;
      }


      fileName.textContent =
        `${selectedFile.name} — ${formatBytes(selectedFile.size)}`;


      startButton.disabled =
        false;


      parts = [];


      partsCard.style.display =
        "none";


      uploadDriveButton.disabled =
        true;

    }
  );


  /* =========================================================
     SPLIT FILE
  ========================================================= */

  startButton.addEventListener(
    "click",
    async () => {

      if (!selectedFile) {
        return;
      }


      const enteredSize =
        Number(
          partSizeInput.value
        );


      if (
        !Number.isFinite(
          enteredSize
        ) ||
        enteredSize <= 0
      ) {

        alert(
          "Please enter a valid size."
        );

        return;
      }


      const partSize =
        convertToBytes(
          enteredSize,
          unitSelect.value
        );


      if (
        !Number.isFinite(partSize) ||
        partSize < 1
      ) {

        alert(
          "The selected size is too small."
        );

        return;
      }


      if (
        partSize >=
        selectedFile.size
      ) {

        alert(
          "The part size must be smaller than the original file."
        );

        return;
      }


      startButton.disabled =
        true;


      progressContainer.style.display =
        "block";


      progressBar.style.width =
        "0%";


      status.textContent =
        "Splitting file...";


      parts = [];


      let offset = 0;

      let partNumber = 1;


      while (
        offset <
        selectedFile.size
      ) {

        const end =
          Math.min(
            offset + partSize,
            selectedFile.size
          );


        const blob =
          selectedFile.slice(
            offset,
            end
          );


        const baseName =
          getBaseName(
            selectedFile.name
          );


        const extension =
          getExtension(
            selectedFile.name
          );


        const partName =
          `${baseName}.part${String(partNumber).padStart(3, "0")}${extension}`;


        parts.push({

          name:
            partName,

          blob:
            blob,

          size:
            blob.size

        });


        offset =
          end;


        const currentPart =
          partNumber;


        partNumber++;


        const percent =
          (
            offset /
            selectedFile.size
          ) *
          100;


        progressBar.style.width =
          `${percent}%`;


        status.textContent =
          `Creating part ${currentPart}... ${percent.toFixed(1)}%`;


        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

      }


      status.textContent =
        `Done. ${parts.length} parts created.`;


      progressBar.style.width =
        "100%";


      showParts();


      startButton.disabled =
        false;


      updateUploadButton();

    }
  );


  /* =========================================================
     SHOW PARTS
  ========================================================= */

  function showParts() {

    partsCard.style.display =
      "block";


    partsList.innerHTML =
      "";


    parts.forEach(
      (part) => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "part";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "part-name";

        name.textContent =
          part.name;


        const size =
          document.createElement(
            "div"
          );

        size.className =
          "part-size";

        size.textContent =
          formatBytes(
            part.size
          );


        const button =
          document.createElement(
            "button"
          );

        button.textContent =
          "Download";


        button.addEventListener(
          "click",
          () => {

            downloadPart(
              part
            );

          }
        );


        div.appendChild(name);

        div.appendChild(size);

        div.appendChild(button);


        partsList.appendChild(div);

      }
    );

  }


  /* =========================================================
     DOWNLOAD ONE PART
  ========================================================= */

  function downloadPart(part) {

    const url =
      URL.createObjectURL(
        part.blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      part.name;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () => {

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );

  }


  /* =========================================================
     DOWNLOAD ALL
  ========================================================= */

  downloadAllButton.addEventListener(
    "click",
    async () => {

      if (!parts.length) {
        return;
      }


      downloadAllButton.disabled =
        true;


      for (
        const part of parts
      ) {

        downloadPart(
          part
        );


        await sleep(
          1200
        );

      }


      downloadAllButton.disabled =
        false;

    }
  );


  /* =========================================================
     UPDATE UPLOAD BUTTON
  ========================================================= */

  function updateUploadButton() {

    uploadDriveButton.disabled =
      !(
        accessToken &&
        parts.length > 0
      );

  }


  /* =========================================================
     UPLOAD ALL PARTS
  ========================================================= */

  uploadDriveButton.addEventListener(
    "click",
    async () => {

      if (!accessToken) {

        alert(
          "Please connect Google Drive first."
        );

        return;
      }


      if (!parts.length) {

        alert(
          "Please split the file first."
        );

        return;
      }


      uploadDriveButton.disabled =
        true;

      downloadAllButton.disabled =
        true;


      uploadProgressContainer.style.display =
        "block";


      uploadProgressBar.style.width =
        "0%";


      uploadStatus.textContent =
        "Starting upload...";

      uploadStatus.className =
        "upload-file-status";


      try {

        const totalBytes =
          parts.reduce(
            (
              total,
              part
            ) =>
              total +
              part.size,
            0
          );


        let uploadedBeforeCurrent =
          0;


        for (
          let i = 0;
          i < parts.length;
          i++
        ) {

          const part =
            parts[i];


          uploadStatus.textContent =
            `Uploading part ${i + 1} of ${parts.length}: ${part.name}`;


          await uploadPartToDrive(

            part,

            uploadedBeforeCurrent,

            totalBytes

          );


          uploadedBeforeCurrent +=
            part.size;


          updateUploadProgress(

            uploadedBeforeCurrent,

            totalBytes,

            `Completed part ${i + 1} of ${parts.length}`

          );

        }


        uploadProgressBar.style.width =
          "100%";


        uploadStatus.textContent =
          `Finished! ${parts.length} parts uploaded to Google Drive.`;


        uploadStatus.className =
          "upload-file-status success";


      } catch (error) {

        console.error(
          "Upload error:",
          error
        );


        uploadStatus.textContent =
          "Upload failed: " +
          error.message;


        uploadStatus.className =
          "upload-file-status error";

      }


      uploadDriveButton.disabled =
        false;

      downloadAllButton.disabled =
        false;

    }
  );


  /* =========================================================
     UPLOAD ONE PART
  ========================================================= */

  async function uploadPartToDrive(
    part,
    uploadedBeforeCurrent,
    totalBytes
  ) {

    /*
      16 MiB chunks.

      16 MiB is divisible by 256 KiB,
      which is suitable for Google Drive
      resumable uploads.
    */

    const CHUNK_SIZE =
      16 *
      1024 *
      1024;


    const sessionUrl =
      await initiateResumableUpload(
        part.blob,
        part.name
      );


    let start =
      0;


    while (
      start <
      part.size
    ) {

      const end =
        Math.min(
          start +
          CHUNK_SIZE,
          part.size
        );


      const chunk =
        part.blob.slice(
          start,
          end
        );


      let response;


      try {

        /*
          IMPORTANT:
          Do NOT manually set Content-Length.
          Browsers block that header.
        */

        response =
          await fetch(
            sessionUrl,
            {

              method:
                "PUT",

              headers: {

                "Content-Range":
                  `bytes ${start}-${end - 1}/${part.size}`

              },

              body:
                chunk

            }
          );

      } catch (networkError) {

        /*
          Ask Google where the upload
          actually stopped.
        */

        await sleep(1500);


        start =
          await getResumePosition(
            sessionUrl,
            part.size
          );


        continue;

      }


      /* -----------------------------------------
         UPLOAD CONTINUES
      ----------------------------------------- */

      if (
        response.status ===
        308
      ) {

        const range =
          response.headers.get(
            "Range"
          );


        if (range) {

          const match =
            range.match(
              /bytes=0-(\d+)/
            );


          if (match) {

            start =
              Number(
                match[1]
              ) + 1;

          } else {

            start =
              end;

          }

        } else {

          start =
            end;

        }


        updateUploadProgress(

          uploadedBeforeCurrent +
          start,

          totalBytes,

          part.name

        );


        continue;

      }


      /* -----------------------------------------
         UPLOAD FINISHED
      ----------------------------------------- */

      if (
        response.status === 200 ||
        response.status === 201
      ) {

        updateUploadProgress(

          uploadedBeforeCurrent +
          part.size,

          totalBytes,

          part.name

        );


        return;

      }


      /* -----------------------------------------
         TEMPORARY SERVER ERROR
      ----------------------------------------- */

      if (
        response.status >= 500 &&
        response.status <= 599
      ) {

        await sleep(
          1500
        );


        start =
          await getResumePosition(
            sessionUrl,
            part.size
          );


        continue;

      }


      /* -----------------------------------------
         AUTH ERROR
      ----------------------------------------- */

      if (
        response.status === 401
      ) {

        throw new Error(
          "Google authorization expired. Please reconnect Google Drive."
        );

      }


      let errorText =
        "";


      try {

        errorText =
          await response.text();

      } catch (_) {}


      throw new Error(
        `Google Drive error ${response.status}: ${errorText || response.statusText}`
      );

    }

  }


  /* =========================================================
     INITIATE RESUMABLE UPLOAD
  ========================================================= */

  async function initiateResumableUpload(
    blob,
    fileName
  ) {

    const response =
      await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
        {

          method:
            "POST",

          headers: {

            "Authorization":
              `Bearer ${accessToken}`,

            "Content-Type":
              "application/json; charset=UTF-8",

            "X-Upload-Content-Type":
              "application/octet-stream",

            "X-Upload-Content-Length":
              String(
                blob.size
              )

          },

          body:
            JSON.stringify({

              name:
                fileName,

              mimeType:
                "application/octet-stream"

            })

        }
      );


    if (
      response.status ===
      401
    ) {

      throw new Error(
        "Google authorization expired. Please reconnect Google Drive."
      );

    }


    if (
      !response.ok
    ) {

      let errorText =
        "";


      try {

        errorText =
          await response.text();

      } catch (_) {}


      throw new Error(
        `Could not start upload: ${response.status} ${errorText}`
      );

    }


    const sessionUrl =
      response.headers.get(
        "Location"
      );


    if (!sessionUrl) {

      throw new Error(
        "Google did not return an upload session URL."
      );

    }


    return sessionUrl;

  }


  /* =========================================================
     FIND UPLOAD POSITION
  ========================================================= */

  async function getResumePosition(
    sessionUrl,
    totalSize
  ) {

    const response =
      await fetch(
        sessionUrl,
        {

          method:
            "PUT",

          headers: {

            "Content-Range":
              `bytes */${totalSize}`

          }

        }
      );


    if (
      response.status === 200 ||
      response.status === 201
    ) {

      return totalSize;

    }


    if (
      response.status === 308
    ) {

      const range =
        response.headers.get(
          "Range"
        );


      if (!range) {

        return 0;

      }


      const match =
        range.match(
          /bytes=0-(\d+)/
        );


      if (!match) {

        return 0;

      }


      return (
        Number(
          match[1]
        ) + 1
      );

    }


    if (
      response.status === 404
    ) {

      throw new Error(
        "The Google Drive upload session expired."
      );

    }


    throw new Error(
      `Could not resume upload: ${response.status}`
    );

  }


  /* =========================================================
     UPLOAD PROGRESS
  ========================================================= */

  function updateUploadProgress(
    uploadedBytes,
    totalBytes,
    message
  ) {

    const percent =
      totalBytes > 0
        ? (
            uploadedBytes /
            totalBytes
          ) * 100
        : 0;


    uploadProgressBar.style.width =
      `${Math.min(
        percent,
        100
      ).toFixed(1)}%`;


    uploadStatus.textContent =
      `${message} — ${Math.min(
        percent,
        100
      ).toFixed(1)}%`;

  }


  /* =========================================================
     FORMAT BYTES
  ========================================================= */

  function formatBytes(
    bytes
  ) {

    if (
      bytes === 0
    ) {

      return "0 Bytes";

    }


    const units = [
      "Bytes",
      "KB",
      "MB",
      "GB",
      "TB"
    ];


    const i =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );


    const safeIndex =
      Math.min(
        i,
        units.length - 1
      );


    return (
      (
        bytes /
        Math.pow(
          1024,
          safeIndex
        )
      ).toFixed(2)
      +
      " "
      +
      units[safeIndex]
    );

  }


  /* =========================================================
     FILE NAME HELPERS
  ========================================================= */

  function getExtension(
    name
  ) {

    const index =
      name.lastIndexOf(".");


    if (
      index === -1
    ) {

      return "";

    }


    return name.substring(
      index
    );

  }


  function getBaseName(
    name
  ) {

    const index =
      name.lastIndexOf(".");


    if (
      index === -1
    ) {

      return name;

    }


    return name.substring(
      0,
      index
    );

  }


  /* =========================================================
     SLEEP
  ========================================================= */

  function sleep(
    ms
  ) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }


  /* =========================================================
     START
  ========================================================= */

  window.addEventListener(
    "load",
    () => {

      initializeGoogleAuth();

    }
  );

</script>
