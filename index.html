<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Drive Splitter</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#222
}

.container{
    max-width:850px;
    margin:40px auto;
    padding:20px
}

.card{
    background:white;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #00000012
}

h1{
    margin-bottom:8px
}

.subtitle{
    color:#666;
    margin-bottom:25px
}

.drop-zone{
    border:2px dashed #aaa;
    border-radius:12px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer
}

.file-name{
    margin-top:15px;
    font-weight:bold;
    word-break:break-all
}

.size-row{
    display:flex;
    gap:10px;
    margin-top:20px
}

input,select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px
}

.size-row input{
    flex:1
}

.size-row select{
    width:150px
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    cursor:pointer;
    background:#222;
    color:#fff
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

.primary{
    width:100%;
    margin-top:20px
}

.google{
    background:#4285f4
}

.progress-container{
    margin-top:20px;
    display:none
}

.progress-bar{
    height:14px;
    background:#e5e5e5;
    border-radius:20px;
    overflow:hidden
}

.progress-fill{
    height:100%;
    width:0;
    background:#222
}

.progress-text{
    margin-top:8px;
    font-size:14px;
    color:#666
}

.part{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px;
    border-bottom:1px solid #eee
}

.part-name{
    font-weight:bold;
    word-break:break-all
}

.part-size{
    color:#777;
    font-size:13px;
    margin-top:4px
}

.hidden{
    display:none!important
}

.status{
    margin-top:12px;
    font-size:14px
}

.success{
    color:#16803c;
    font-weight:bold
}

.error{
    color:#c62828;
    white-space:pre-wrap
}

.note{
    color:#666;
    font-size:14px;
    line-height:1.5
}

@media(max-width:600px){

    .container{
        margin:15px auto;
        padding:12px
    }

    .size-row{
        flex-direction:column
    }

    .size-row select{
        width:100%
    }

    .part{
        flex-direction:column;
        align-items:stretch
    }

}
</style>
</head>

<body>

<div class="container">

<h1>Maria Drive Splitter</h1>

<div class="subtitle">
Split your original file directly into parts and upload them to Google Drive.
</div>

<div class="card">

<div id="dropZone" class="drop-zone">

<strong>Choose a file</strong>
<br><br>

Click here or drag a file here

<input id="fileInput" type="file" hidden>

</div>

<div id="fileName" class="file-name"></div>

<div class="size-row">

<input
    id="sizeInput"
    type="number"
    min="0.000001"
    step="any"
    value="700"
>

<select id="sizeUnit">

<option value="bit">bit</option>
<option value="Byte">Byte</option>
<option value="KB">KB</option>
<option value="MB" selected>MB</option>
<option value="GB">GB</option>
<option value="TB">TB</option>

</select>

</div>

<button id="startButton" class="primary" disabled>
Split File
</button>

<div id="progress" class="progress-container">

<div class="progress-bar">
<div id="progressFill" class="progress-fill"></div>
</div>

<div id="progressText" class="progress-text"></div>

</div>

<div id="status" class="status"></div>

</div>


<div id="partsCard" class="card hidden">

<h2>Parts</h2>

<div id="partsList"></div>

<button id="downloadAll" class="primary">
Download All Parts
</button>

<button id="uploadButton" class="primary" disabled>
Upload Parts to Google Drive
</button>

<div id="uploadProgress" class="progress-container">

<div class="progress-bar">
<div id="uploadFill" class="progress-fill"></div>
</div>

<div id="uploadText" class="progress-text"></div>

</div>

</div>


<div class="card">

<h2>Google Drive</h2>

<p class="note">
Connect Google Drive before uploading.
</p>

<button id="googleButton" class="google">
Connect Google Drive
</button>

<div id="googleStatus" class="status"></div>

</div>

</div>


<script>

/* =====================================================
   GOOGLE
   ===================================================== */

const GOOGLE_CLIENT_ID =
"304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive.file";

let selectedFile = null;
let accessToken = null;
let googleTokenClient = null;
let parts = [];


/* =====================================================
   ELEMENTS
   ===================================================== */

const fileInput =
document.getElementById("fileInput");

const dropZone =
document.getElementById("dropZone");

const fileName =
document.getElementById("fileName");

const sizeInput =
document.getElementById("sizeInput");

const sizeUnit =
document.getElementById("sizeUnit");

const startButton =
document.getElementById("startButton");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const progressText =
document.getElementById("progressText");

const status =
document.getElementById("status");

const partsCard =
document.getElementById("partsCard");

const partsList =
document.getElementById("partsList");

const downloadAll =
document.getElementById("downloadAll");

const uploadButton =
document.getElementById("uploadButton");

const uploadProgress =
document.getElementById("uploadProgress");

const uploadFill =
document.getElementById("uploadFill");

const uploadText =
document.getElementById("uploadText");

const googleButton =
document.getElementById("googleButton");

const googleStatus =
document.getElementById("googleStatus");


/* =====================================================
   HELPERS
   ===================================================== */

function formatBytes(bytes){

    if(!bytes) return "0 Bytes";

    const units =
    ["Bytes","KB","MB","GB","TB"];

    const i =
    Math.floor(
        Math.log(bytes) / Math.log(1024)
    );

    return (
        (bytes / Math.pow(1024,i))
        .toFixed(i ? 2 : 0)
        + " "
        + units[i]
    );
}


function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}


function setStatus(text,error=false){

    status.textContent = text;

    status.className =
    error
        ? "status error"
        : "status";
}


function setProgress(percent,text){

    progress.style.display = "block";

    progressFill.style.width =
    Math.min(
        100,
        Math.max(0,percent)
    ) + "%";

    progressText.textContent = text;
}


function setUploadProgress(percent,text){

    uploadProgress.style.display = "block";

    uploadFill.style.width =
    Math.min(
        100,
        Math.max(0,percent)
    ) + "%";

    uploadText.textContent = text;
}


/* =====================================================
   SIZE
   ===================================================== */

function convertToBytes(){

    const value =
    Number(sizeInput.value);

    if(
        !Number.isFinite(value) ||
        value <= 0
    ){

        throw new Error(
            "Enter a valid part size."
        );
    }

    const multiplier = {

        bit: 1 / 8,
        Byte: 1,
        KB: 1024,
        MB: 1024 ** 2,
        GB: 1024 ** 3,
        TB: 1024 ** 4

    };

    const bytes =
    value * multiplier[sizeUnit.value];

    if(
        !Number.isFinite(bytes) ||
        bytes < 1
    ){

        throw new Error(
            "Part size must be at least 1 Byte."
        );
    }

    return Math.floor(bytes);
}


/* =====================================================
   FILE PICKER
   ===================================================== */

function selectFile(file){

    if(!file){
        return;
    }

    selectedFile = file;

    fileName.textContent =
    selectedFile.name +
    " — " +
    formatBytes(selectedFile.size);

    startButton.disabled = false;

    parts = [];

    partsList.innerHTML = "";

    partsCard.classList.add("hidden");

    setStatus("");
}


dropZone.onclick = () => {
    fileInput.click();
};


fileInput.onchange = () => {

    if(fileInput.files.length){

        selectFile(
            fileInput.files[0]
        );

    }
};


dropZone.ondragover = e => {
    e.preventDefault();
};


dropZone.ondrop = e => {

    e.preventDefault();

    if(e.dataTransfer.files.length){

        selectFile(
            e.dataTransfer.files[0]
        );

    }
};


/* =====================================================
   DIRECT SPLIT
   ===================================================== */

async function splitFile(
    file,
    partSize
){

    parts = [];

    partsList.innerHTML = "";

    const total =
    Math.ceil(
        file.size / partSize
    );


    for(
        let i = 0;
        i < total;
        i++
    ){

        const start =
        i * partSize;

        const end =
        Math.min(
            start + partSize,
            file.size
        );


        /*
         * THIS IS THE IMPORTANT PART:
         *
         * No ZIP.
         * No 7z.
         * No compression.
         *
         * This takes the original file
         * and creates a Blob containing
         * only this section.
         */

        const partBlob =
        file.slice(
            start,
            end,
            file.type ||
            "application/octet-stream"
        );


        const number =
        String(i + 1)
        .padStart(3,"0");


        parts.push({

            name:
            file.name +
            ".part" +
            number,

            blob:
            partBlob,

            size:
            partBlob.size

        });


        setProgress(

            ((i + 1) / total) * 100,

            `Creating part ${i + 1} of ${total}...`

        );


        await new Promise(
            requestAnimationFrame
        );
    }


    renderParts();
}


/* =====================================================
   RENDER PARTS
   ===================================================== */

function renderParts(){

    partsCard.classList.remove(
        "hidden"
    );

    partsList.innerHTML = "";


    parts.forEach(part => {

        const row =
        document.createElement("div");

        row.className = "part";


        const info =
        document.createElement("div");


        const name =
        document.createElement("div");

        name.className =
        "part-name";

        name.textContent =
        part.name;


        const size =
        document.createElement("div");

        size.className =
        "part-size";

        size.textContent =
        formatBytes(part.size);


        info.appendChild(name);
        info.appendChild(size);


        const button =
        document.createElement("button");

        button.textContent =
        "Download";


        button.onclick = () => {

            downloadBlob(
                part.blob,
                part.name
            );

        };


        row.appendChild(info);
        row.appendChild(button);

        partsList.appendChild(row);

    });


    uploadButton.disabled =
    !accessToken ||
    parts.length === 0;
}


/* =====================================================
   DOWNLOAD
   ===================================================== */

function downloadBlob(
    blob,
    name
){

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;
    a.download = name;

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        () =>
        URL.revokeObjectURL(url),
        1000
    );
}


/* =====================================================
   START
   ===================================================== */

startButton.onclick =
async () => {

    if(!selectedFile){
        return;
    }


    startButton.disabled = true;

    partsCard.classList.add(
        "hidden"
    );


    try{

        const partSize =
        convertToBytes();


        setStatus(
            "Splitting original file..."
        );


        await splitFile(
            selectedFile,
            partSize
        );


        setStatus(

            "Done! " +
            parts.length +
            " parts created."

        );


        uploadButton.disabled =
        !accessToken;


    }catch(error){

        console.error(error);

        setStatus(

            error.message ||
            "Something went wrong.",

            true

        );

    }finally{

        startButton.disabled = false;

    }

};


/* =====================================================
   GOOGLE AUTH
   ===================================================== */

function initGoogle(){

    if(
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ){

        setTimeout(
            initGoogle,
            500
        );

        return;
    }


    googleTokenClient =
    google.accounts.oauth2
    .initTokenClient({

        client_id:
        GOOGLE_CLIENT_ID,

        scope:
        DRIVE_SCOPE,

        callback:
        response => {

            if(
                response.access_token
            ){

                accessToken =
                response.access_token;


                googleButton.textContent =
                "Google Drive Connected";


                googleStatus.textContent =
                "Connected successfully.";


                googleStatus.className =
                "status success";


                uploadButton.disabled =
                parts.length === 0;
            }

        }

    });

}


googleButton.onclick = () => {

    if(!googleTokenClient){

        initGoogle();

        setTimeout(() => {

            if(
                googleTokenClient
            ){

                googleTokenClient
                .requestAccessToken({

                    prompt:
                    "consent"

                });

            }

        },700);

        return;
    }


    googleTokenClient
    .requestAccessToken({

        prompt:
        "consent"

    });

};


initGoogle();


/* =====================================================
   DOWNLOAD ALL
   ===================================================== */

downloadAll.onclick =
async () => {

    for(
        const part of parts
    ){

        downloadBlob(
            part.blob,
            part.name
        );

        await sleep(300);
    }

};


/* =====================================================
   GOOGLE DRIVE UPLOAD SESSION
   ===================================================== */

async function createUploadSession(
    part
){

    const response =
    await fetch(

        "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",

        {

            method:
            "POST",

            headers: {

                Authorization:
                "Bearer " +
                accessToken,

                "Content-Type":
                "application/json",

                "X-Upload-Content-Type":
                "application/octet-stream",

                "X-Upload-Content-Length":
                String(part.size)

            },

            body:
            JSON.stringify({

                name:
                part.name,

                mimeType:
                "application/octet-stream"

            })

        }

    );


    if(
        response.status === 401
    ){

        throw new Error(
            "Google authorization expired. Please reconnect Google Drive."
        );
    }


    if(!response.ok){

        const text =
        await response.text();

        throw new Error(

            "Could not create upload session: " +
            response.status +
            "\n" +
            text

        );
    }


    const location =
    response.headers.get(
        "Location"
    );


    if(!location){

        throw new Error(
            "Google Drive did not return an upload URL."
        );
    }


    return location;
}


/* =====================================================
   CHECK UPLOAD POSITION
   ===================================================== */

async function getUploadedPosition(
    url,
    totalSize
){

    const response =
    await fetch(

        url,

        {

            method:
            "PUT",

            headers: {

                Authorization:
                "Bearer " +
                accessToken,

                "Content-Range":
                `bytes */${totalSize}`

            }

        }

    );


    if(
        response.status === 308
    ){

        const range =
        response.headers.get(
            "Range"
        );


        if(range){

            const match =
            range.match(
                /bytes=0-(\d+)/
            );


            if(match){

                return (
                    Number(match[1]) + 1
                );
            }
        }


        return 0;
    }


    if(
        response.status === 200 ||
        response.status === 201
    ){

        return totalSize;
    }


    return 0;
}


/* =====================================================
   UPLOAD PART
   ===================================================== */

async function uploadPart(
    part,
    index,
    total,
    completedBytes,
    totalBytes
){

    const url =
    await createUploadSession(
        part
    );


    const chunkSize =
    16 * 1024 * 1024;


    let position = 0;


    while(
        position < part.size
    ){

        const end =
        Math.min(
            position + chunkSize,
            part.size
        );


        const chunk =
        part.blob.slice(
            position,
            end
        );


        let response;


        try{

            response =
            await fetch(

                url,

                {

                    method:
                    "PUT",

                    headers: {

                        Authorization:
                        "Bearer " +
                        accessToken,

                        "Content-Type":
                        "application/octet-stream",

                        "Content-Range":
                        `bytes ${position}-${end - 1}/${part.size}`

                    },

                    body:
                    chunk

                }

            );

        }catch(error){

            await sleep(1500);

            position =
            await getUploadedPosition(
                url,
                part.size
            );

            continue;
        }


        if(
            response.status === 401
        ){

            throw new Error(
                "Google authorization expired. Please reconnect Google Drive."
            );
        }


        if(
            response.status === 308
        ){

            const range =
            response.headers.get(
                "Range"
            );


            if(range){

                const match =
                range.match(
                    /bytes=0-(\d+)/
                );


                if(match){

                    position =
                    Number(match[1]) + 1;

                }else{

                    position = end;

                }

            }else{

                position = end;

            }


            const overall =
            (
                completedBytes +
                position
            ) /
            totalBytes *
            100;


            setUploadProgress(

                overall,

                `Uploading part ${index + 1} of ${total} — ${formatBytes(position)} / ${formatBytes(part.size)}`

            );


            continue;
        }


        if(
            response.status === 200 ||
            response.status === 201
        ){

            position =
            part.size;


            const overall =
            (
                completedBytes +
                part.size
            ) /
            totalBytes *
            100;


            setUploadProgress(

                overall,

                `Uploaded part ${index + 1} of ${total}`

            );


            continue;
        }


        if(
            response.status >= 500
        ){

            await sleep(2000);

            position =
            await getUploadedPosition(
                url,
                part.size
            );

            continue;
        }


        const errorText =
        await response.text();


        throw new Error(

            `Upload failed for part ${index + 1}. Status: ${response.status}\n${errorText}`

        );

    }

}


/* =====================================================
   UPLOAD ALL PARTS
   ===================================================== */

uploadButton.onclick =
async () => {

    if(
        !accessToken ||
        parts.length === 0
    ){

        return;
    }


    uploadButton.disabled = true;
    downloadAll.disabled = true;


    const totalBytes =
    parts.reduce(
        (sum,part) =>
        sum + part.size,
        0
    );


    let completedBytes = 0;


    try{

        setUploadProgress(
            0,
            "Starting upload..."
        );


        for(
            let i = 0;
            i < parts.length;
            i++
        ){

            const part =
            parts[i];


            setUploadProgress(

                (
                    completedBytes /
                    totalBytes
                ) * 100,

                `Uploading part ${i + 1} of ${parts.length}...`

            );


            await uploadPart(

                part,
                i,
                parts.length,
                completedBytes,
                totalBytes

            );


            completedBytes +=
            part.size;


            setUploadProgress(

                (
                    completedBytes /
                    totalBytes
                ) * 100,

                `Uploaded ${i + 1} of ${parts.length} parts.`

            );

        }


        setUploadProgress(
            100,
            "All parts uploaded successfully."
        );


        setStatus(
            "All parts uploaded to Google Drive.",
            false
        );

        status.className =
        "status success";


    }catch(error){

        console.error(error);


        setUploadProgress(
            0,
            "Upload stopped."
        );


        setStatus(
            error.message ||
            "Upload failed.",
            true
        );


    }finally{

        uploadButton.disabled =
        !accessToken ||
        parts.length === 0;

        downloadAll.disabled = false;

    }

};

</script>

</body>
</html>
