<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maria Drive Splitter</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #1a73e8;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    .success {
      background: #188038;
    }

    .danger {
      background: #d93025;
    }

    .drive-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f3f4;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;

    input[type="number"] {
      width: 180px;
    }

    select {
      min-width: 130px;
    }

    .file-info {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
      word-break: break-word;
    }

    .parts {
      margin-top: 20px;
    }

    .part {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #f8f9fa;
      border: 1px solid #ddd;
    }

    .part-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .part-name {
      font-weight: bold;
      word-break: break-all;
      flex: 1;
    }

    .part-status {
      margin-top: 8px;

      color: #666;
    }

    .progress-container {
      width: 100%;

    }

    .selected-file {
      padding: 12px;

    .merge-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fce8e6;
      color: #c5221f;
    }

    .message.success {
      background: #e6f4ea;
      color: #137333;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }

    .merge-progress {
      margin-top: 15px;
    }

    .merge-progress-text {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>Maria Drive Splitter</h1>

  <div class="subtitle">
    Split large files and merge them again
  </div>


  <!-- GOOGLE DRIVE -->

  <div class="card">

    <h2>☁️ Google Drive</h2>

    <button
      id="connectGoogleBtn"
      onclick="connectGoogle()"
    >
      Connect Google Drive
    </button>

    <div
      id="driveStatus"
      class="drive-status"
    >
      Not connected
    </div>

  </div>


  <!-- SPLIT -->

  <div class="card">

    <h2>✂️ Split File</h2>

    <input
      type="file"
      id="fileInput"
    >

    <div
      id="fileInfo"
      class="file-info"
      style="display:none;"
    ></div>


    <div class="input-row">

      <input
        type="number"
        id="partSize"
        placeholder="Part size"
        min="0.000001"
        step="any"
      >

      <select id="partUnit">

        <option value="bit">
          Bit
        </option>

        <option value="byte" selected>
          Byte
        </option>

        <option value="kb">
          KB
        </option>

        <option value="mb">
          MB
        </option>

        <option value="gb">
          GB
        </option>

        <option value="tb">
          TB
        </option>

      </select>

      <button onclick="splitFile()">
        Split File
      </button>

    </div>


    <div class="small">
      Choose the size of each part.
    </div>


    <div
      id="splitMessage"
      class="message"
    ></div>


    <div
      id="partsContainer"
      class="parts"
    ></div>

  </div>



  <!-- MERGE -->

  <div class="card">

    <h2>🔗 Merge Files</h2>

    <p>
      Choose the parts directly from your computer.
    </p>


    <!-- IMPORTANT:
         This is LOCAL DEVICE ONLY.
         No Google Drive Picker.
    -->

    <input
      type="file"
      id="mergeFileInput"
      multiple
      style="display:none;"
      onchange="handleMergeFiles(this.files)"
    >


    <button
      onclick="document.getElementById('mergeFileInput').click()"
    >
      Choose Parts from Device
    </button>


    <button
      class="secondary"
      onclick="clearMergeFiles()"
    >
      Clear Selection
    </button>


    <div
      id="selectedFiles"
      style="margin-top:15px;"
    ></div>


    <div class="merge-actions">

      <button
        class="success"
        id="mergeButton"
        onclick="mergeSelectedFiles()"
        disabled
      >
        Merge Selected Files
      </button>

    </div>


    <div
      id="mergeProgress"
      class="merge-progress"
      style="display:none;"
    >

      <div
        id="mergeProgressText"
        class="merge-progress-text"
      >
        Preparing...
      </div>

      <div class="progress-container">

        <div
          id="mergeProgressBar"
          class="progress"
        ></div>

      </div>

    </div>


    <div
      id="mergeMessage"
      class="message"
    ></div>


    <div
      id="mergedResult"
      style="margin-top:20px;"
    ></div>

  </div>

</div>



<script>


// ============================================================
// GOOGLE CONFIG
// ============================================================

const GOOGLE_CLIENT_ID =
  "304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com";


const DRIVE_SCOPE =
  "https://www.googleapis.com/auth/drive.file";


// ============================================================
// GLOBAL VARIABLES
// ============================================================

let accessToken = null;

let tokenClient = null;

let currentParts = [];

let selectedMergeFiles = [];



// ============================================================
// GOOGLE LOGIN
// ============================================================

function connectGoogle() {

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    alert(
      "Google Sign-In is still loading. Please wait a moment and try again."
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        GOOGLE_CLIENT_ID,

      scope:
        DRIVE_SCOPE,

      callback:
        async function(response) {

          if (
            response.error
          ) {

            console.error(response);

            setDriveStatus(
              "Google authorization failed."
            );

            return;
          }


          accessToken =
            response.access_token;


          setDriveStatus(
            "Connected to Google Drive"
          );


          document.getElementById(
            "connectGoogleBtn"
          ).textContent =
            "Google Drive Connected";

        }

    });


  tokenClient.requestAccessToken({
    prompt: "consent"
  });

}



// ============================================================
// DRIVE STATUS
// ============================================================

function setDriveStatus(text) {

  document.getElementById(
    "driveStatus"
  ).textContent =
    text;

}



// ============================================================
// FILE INFORMATION
// ============================================================

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) {

        document.getElementById(
          "fileInfo"
        ).style.display =
          "none";

        return;
      }


      const info =
        document.getElementById(
          "fileInfo"
        );


      info.style.display =
        "block";


      info.innerHTML = `
        <strong>Selected file:</strong><br>
        ${escapeHtml(file.name)}
        <br><br>
        <strong>Size:</strong>
        ${formatBytes(file.size)}
      `;

    }
  );



// ============================================================
// PART SIZE
// ============================================================

function getPartSizeBytes() {

  const value =
    parseFloat(
      document.getElementById(
        "partSize"
      ).value
    );


  if (
    !Number.isFinite(value) ||
    value <= 0
  ) {

    return null;

  }


  const unit =
    document.getElementById(
      "partUnit"
    ).value;


  const multipliers = {

    bit:
      1 / 8,

    byte:
      1,

    kb:
      1024,

    mb:
      1024 * 1024,

    gb:
      1024 * 1024 * 1024,

    tb:
      1024 * 1024 * 1024 * 1024

  };


  return (
    value *
    multipliers[unit]
  );

}



// ============================================================
// SPLIT
// ============================================================

async function splitFile() {

  const input =
    document.getElementById(
      "fileInput"
    );


  const file =
    input.files[0];


  if (!file) {

    showMessage(
      "splitMessage",
      "Please choose a file first.",
      true
    );

    return;
  }


  const partSize =
    getPartSizeBytes();


  if (
    !partSize ||
    partSize < 1
  ) {

    showMessage(
      "splitMessage",
      "Please enter a valid part size.",
      true
    );

    return;
  }


  const actualPartSize =
    Math.floor(partSize);


  currentParts = [];


  const container =
    document.getElementById(
      "partsContainer"
    );


  container.innerHTML =
    "";


  const totalParts =
    Math.ceil(
      file.size /
      actualPartSize
    );


  /*
    We create each part directly from
    the original File using slice().

    The original file is never uploaded
    as one big file.
  */

  for (
    let i = 0;
    i < totalParts;
    i++
  ) {

    const start =
      i *
      actualPartSize;


    const end =
      Math.min(
        start +
        actualPartSize,
        file.size
      );


    const blob =
      file.slice(
        start,
        end
      );


    const number =
      i + 1;


    const numberText =
      String(number)
        .padStart(
          3,
          "0"
        );


    const name =
      `${file.name}.part${numberText}`;


    currentParts.push({

      number:
        number,

      name:
        name,

      blob:
        blob,

      size:
        blob.size,

      uploaded:
        false,

      driveId:
        null

    });

  }


  displayParts();


  showMessage(
    "splitMessage",
    `${totalParts} part(s) created successfully.`,
    false
  );

}



// ============================================================
// DISPLAY PARTS
// ============================================================

function displayParts() {

  const container =
    document.getElementById(
      "partsContainer"
    );


  container.innerHTML =
    "";


  if (
    currentParts.length === 0
  ) {

    return;
  }


  const uploadAll =
    document.createElement(
      "button"
    );


  uploadAll.className =
    "success";


  uploadAll.textContent =
    "Upload All Parts to Google Drive";


  uploadAll.onclick =
    uploadAllParts;


  container.appendChild(
    uploadAll
  );


  currentParts.forEach(
    function(part) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "part";


      div.id =
        `part-${part.number}`;


      div.innerHTML = `

        <div class="part-header">

          <div class="part-name">
            ${escapeHtml(part.name)}
          </div>

          <button
            onclick="downloadPart(${part.number})"
          >
            Download
          </button>

          <button
            class="success"
            onclick="uploadPart(${part.number})"
          >
            Upload
          </button>

        </div>


        <div
          class="part-status"
          id="status-${part.number}"
        >
          ${formatBytes(part.size)}
        </div>


        <div class="progress-container">

          <div
            id="progress-${part.number}"
            class="progress"
          ></div>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}



// ============================================================
// DOWNLOAD PART
// ============================================================

function downloadPart(number) {

  const part =
    currentParts.find(
      p =>
        p.number === number
    );


  if (!part) {

    return;
  }


  const url =
    URL.createObjectURL(
      part.blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    part.name;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}



// ============================================================
// UPLOAD ONE PART
// ============================================================

async function uploadPart(number) {

  if (!accessToken) {

    alert(
      "Connect Google Drive first."
    );

    return;
  }


  const part =
    currentParts.find(
      p =>
        p.number === number
    );


  if (!part) {

    return;
  }


  try {

    updatePartStatus(
      number,
      "Uploading..."
    );


    const fileId =
      await uploadToDrive(
        part.blob,
        part.name,
        function(percent) {

          updateProgress(
            number,
            percent
          );

        }
      );


    part.uploaded =
      true;


    part.driveId =
      fileId;


    updatePartStatus(
      number,
      "Uploaded successfully"
    );


    updateProgress(
      number,
      100
    );


  } catch (error) {

    console.error(error);


    updatePartStatus(
      number,
      "Upload failed: " +
      error.message
    );

  }

}



// ============================================================
// UPLOAD ALL
// ============================================================

async function uploadAllParts() {

  if (!accessToken) {

    alert(
      "Connect Google Drive first."
    );

    return;
  }


  for (
    const part of currentParts
  ) {

    if (
      part.uploaded
    ) {

      continue;
    }


    await uploadPart(
      part.number
    );

  }


  alert(
    "Finished uploading all parts."
  );

}



// ============================================================
// GOOGLE DRIVE RESUMABLE UPLOAD
// ============================================================

async function uploadToDrive(
  blob,
  fileName,
  onProgress
) {

  const metadata = {

    name:
      fileName,

    mimeType:
      "application/octet-stream"

  };


  const initResponse =
    await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
      {

        method:
          "POST",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json; charset=UTF-8",

          "X-Upload-Content-Type":
            "application/octet-stream",

          "X-Upload-Content-Length":
            String(
              blob.size
            )

        },

        body:
          JSON.stringify(
            metadata
          )

      }
    );


  if (
    !initResponse.ok
  ) {

    const text =
      await initResponse.text();


    throw new Error(
      "Could not create upload session: " +
      text
    );

  }


  const uploadUrl =
    initResponse.headers.get(
      "Location"
    );


  if (!uploadUrl) {

    throw new Error(
      "Google Drive did not return an upload URL."
    );

  }


  /*
    16 MiB chunks.
  */

  const chunkSize =
    16 * 1024 * 1024;


  let offset =
    0;


  while (
    offset <
    blob.size
  ) {

    const end =
      Math.min(
        offset +
        chunkSize,
        blob.size
      );


    const chunk =
      blob.slice(
        offset,
        end
      );


    let attempts =
      0;


    while (true) {

      try {

        const response =
          await fetch(
            uploadUrl,
            {

              method:
                "PUT",

              headers: {

                "Content-Length":
                  String(
                    chunk.size
                  ),

                "Content-Range":
                  `bytes ${offset}-${end - 1}/${blob.size}`

              },

              body:
                chunk

            }
          );


        /*
          308 means Google received the chunk
          and wants the next one.
        */

        if (
          response.status === 308
        ) {

          const range =
            response.headers.get(
              "Range"
            );


          if (range) {

            const match =
              range.match(
                /bytes=0-(\d+)/
              );


            if (match) {

              offset =
                Number(
                  match[1]
                ) + 1;

            } else {

              offset =
                end;

            }

          } else {

            offset =
              end;

          }


          break;

        }


        /*
          Final upload response.
        */

        if (
          response.ok
        ) {

          let result =
            null;


          try {

            result =
              await response.json();

          } catch (_) {}


          offset =
            end;


          if (
            onProgress
          ) {

            onProgress(
              100
            );

          }


          return result
            ? result.id
            : null;

        }


        /*
          Retry temporary errors.
        */

        if (
          response.status === 429 ||
          response.status >= 500
        ) {

          throw new Error(
            "Temporary upload error"
          );

        }


        const text =
          await response.text();


        throw new Error(
          text
        );

      } catch (error) {

        attempts++;


        if (
          attempts >= 5
        ) {

          throw error;

        }


        await sleep(
          Math.min(
            1000 *
            Math.pow(
              2,
              attempts
            ),
            10000
          )
        );

      }

    }


    if (
      onProgress
    ) {

      onProgress(
        Math.round(
          (
            offset /
            blob.size
          ) *
          100
        )
      );

    }

  }

}



// ============================================================
// LOCAL MERGE — SELECT FILES
// ============================================================

function handleMergeFiles(
  fileList
) {

  selectedMergeFiles =
    Array.from(
      fileList
    );


  displaySelectedMergeFiles();

}



// ============================================================
// DISPLAY LOCAL FILES
// ============================================================

function displaySelectedMergeFiles() {

  const container =
    document.getElementById(
      "selectedFiles"
    );


  const mergeButton =
    document.getElementById(
      "mergeButton"
    );


  container.innerHTML =
    "";


  mergeButton.disabled =
    selectedMergeFiles.length === 0;


  if (
    selectedMergeFiles.length === 0
  ) {

    return;
  }


  const validFiles =
    selectedMergeFiles.filter(
      file =>
        getPartNumber(
          file.name
        ) !== null
    );


  const title =
    document.createElement(
      "p"
    );


  title.innerHTML =
    `<strong>${selectedMergeFiles.length} file(s) selected</strong>`;


  container.appendChild(
    title
  );


  selectedMergeFiles.forEach(
    function(file, index) {

      const number =
        getPartNumber(
          file.name
        );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "selected-file";


      div.innerHTML = `

        <strong>
          ${index + 1}.
        </strong>

        ${escapeHtml(file.name)}

        <br>

        <span class="small">

          ${number !== null
            ? "Part " + number
            : "⚠️ Not a valid .part file"
          }

          —
          ${formatBytes(file.size)}

        </span>

      `;


      container.appendChild(
        div
      );

    }
  );


  if (
    validFiles.length !==
    selectedMergeFiles.length
  ) {

    showMessage(
      "mergeMessage",
      "Some selected files are not valid split parts.",
      true
    );

  } else {

    document.getElementById(
      "mergeMessage"
    ).className =
      "message";

  }

}



// ============================================================
// CLEAR MERGE FILES
// ============================================================

function clearMergeFiles() {

  selectedMergeFiles =
    [];


  document.getElementById(
    "mergeFileInput"
  ).value =
    "";


  document.getElementById(
    "selectedFiles"
  ).innerHTML =
    "";


  document.getElementById(
    "mergeButton"
  ).disabled =
    true;


  document.getElementById(
    "mergedResult"
  ).innerHTML =
    "";


  document.getElementById(
    "mergeProgress"
  ).style.display =
    "none";


  document.getElementById(
    "mergeMessage"
  ).className =
    "message";

}



// ============================================================
// GET PART NUMBER
// ============================================================

function getPartNumber(
  name
) {

  /*
    Accepts:

    file.mp4.part001
    file.pdf.part002
    file.zip.part003

    Also accepts:
    part1
    part2

    but the normal Split format is
    .part001, .part002, etc.
  */

  const match =
    name.match(
      /\.part(\d+)$/i
    );


  if (!match) {

    return null;

  }


  return Number(
    match[1]
  );

}



// ============================================================
// GET ORIGINAL NAME
// ============================================================

function getOriginalName(
  name
) {

  return name.replace(
    /\.part\d+$/i,
    ""
  );

}



// ============================================================
// MERGE
// ============================================================

async function mergeSelectedFiles() {

  if (
    selectedMergeFiles.length === 0
  ) {

    showMessage(
      "mergeMessage",
      "Please choose the parts from your device first.",
      true
    );

    return;
  }


  try {

    showMessage(
      "mergeMessage",
      "Checking files...",
      false
    );


    /*
      Get part information.
    */

    const parts =
      selectedMergeFiles.map(
        function(file) {

          return {

            file:
              file,

            number:
              getPartNumber(
                file.name
              ),

            originalName:
              getOriginalName(
                file.name
              )

          };

        }
      );


    /*
      Validate .part format.
    */

    for (
      const part of parts
    ) {

      if (
        part.number === null
      ) {

        throw new Error(
          `"${part.file.name}" is not a valid split part.`
        );

      }

    }


    /*
      All parts must have the
      same original filename.
    */

    const originalName =
      parts[0].originalName;


    for (
      const part of parts
    ) {

      if (
        part.originalName !==
        originalName
      ) {

        throw new Error(
          "The selected parts belong to different original files."
        );

      }

    }


    /*
      Check duplicate numbers.
    */

    const numbers =
      parts.map(
        p =>
          p.number
      );


    const uniqueNumbers =
      new Set(
        numbers
      );


    if (
      uniqueNumbers.size !==
      numbers.length
    ) {

      throw new Error(
        "A part number was selected more than once."
      );

    }


    /*
      Sort:
      1,2,3,4...
    */

    parts.sort(
      function(a,b) {

        return a.number -
          b.number;

      }
    );


    /*
      Make sure we have:
      part001
      part002
      part003
      ...

      with no gaps.
    */

    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      const expected =
        i + 1;


      if (
        parts[i].number !==
        expected
      ) {

        throw new Error(
          `Missing part${String(expected).padStart(3,"0")}.`
        );

      }

    }


    /*
      Total size.
    */

    let totalSize =
      0;


    for (
      const part of parts
    ) {

      totalSize +=
        part.file.size;

    }


    /*
      Show progress.
    */

    const progress =
      document.getElementById(
        "mergeProgress"
      );


    const progressText =
      document.getElementById(
        "mergeProgressText"
      );


    const progressBar =
      document.getElementById(
        "mergeProgressBar"
      );


    progress.style.display =
      "block";


    progressBar.style.width =
      "0%";


    progressText.textContent =
      "Preparing merged file...";


    /*
      ========================================================
      PREFERRED METHOD:
      File System Access API
      ========================================================

      Chrome / Edge on Windows support this.

      The output is written directly to disk,
      so a huge file doesn't have to exist
      completely in browser RAM.
    */

    if (
      "showSaveFilePicker" in window
    ) {

      const handle =
        await window.showSaveFilePicker({

          suggestedName:
            originalName,

          types: [

            {
              description:
                "Merged file",

              accept: {

                "*/*":
                  [
                    getExtension(
                      originalName
                    )
                  ]

              }

            }

          ]

        });


      const writable =
        await handle.createWritable();


      let written =
        0;


      try {

        for (
          let i = 0;
          i < parts.length;
          i++
        ) {

          const part =
            parts[i];


          progressText.textContent =
            `Merging part ${i + 1} of ${parts.length}...`;


          /*
            Read each local part as a stream.
          */

          const reader =
            part.file.stream()
              .getReader();


          try {

            while (true) {

              const result =
                await reader.read();


              if (
                result.done
              ) {

                break;

              }


              await writable.write(
                result.value
              );


              written +=
                result.value.byteLength;


              const percent =
                Math.round(
                  (
                    written /
                    totalSize
                  ) *
                  100
                );


              progressBar.style.width =
                percent + "%";


              progressText.textContent =
                `Merging... ${percent}%`;

            }

          } finally {

            reader.releaseLock();

          }

        }


        await writable.close();


        progressBar.style.width =
          "100%";


        progressText.textContent =
          "Merge completed successfully.";


        showMessage(
          "mergeMessage",
          "The file was merged successfully and saved to your device.",
          false
        );


        document.getElementById(
          "mergedResult"
        ).innerHTML = `

          <div class="file-info">

            <strong>
              ✅ Merge completed
            </strong>

            <br><br>

            File:
            ${escapeHtml(originalName)}

            <br>

            Size:
            ${formatBytes(totalSize)}

          </div>

        `;


      } catch (error) {

        try {

          await writable.abort();

        } catch (_) {}


        throw error;

      }


      return;

    }


    /*
      ========================================================
      FALLBACK
      ========================================================

      If the browser doesn't support
      showSaveFilePicker, use Blob.

      This is okay for smaller files,
      but very large files are better
      handled by Chrome/Edge with the
      method above.
    */

    progressText.textContent =
      "Preparing merged file in browser memory...";


    const blobs = [];


    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      progressText.textContent =
        `Loading part ${i + 1} of ${parts.length}...`;


      blobs.push(
        parts[i].file
      );


      const percent =
        Math.round(
          (
            blobs.reduce(
              (sum, file) =>
                sum +
                file.size,
              0
            ) /
            totalSize
          ) *
          100
        );


      progressBar.style.width =
        percent + "%";

    }


    const mergedBlob =
      new Blob(
        blobs,
        {
          type:
            "application/octet-stream"
        }
      );


    const url =
      URL.createObjectURL(
        mergedBlob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;


    a.download =
      originalName;


    document.body.appendChild(
      a
    );


    a.click();


    a.remove();


    setTimeout(
      function() {

        URL.revokeObjectURL(
          url
        );

      },
      5000
    );


    progressBar.style.width =
      "100%";


    progressText.textContent =
      "Merge completed successfully.";


    showMessage(
      "mergeMessage",
      "The file was merged successfully.",
      false
    );


  } catch (error) {

    console.error(
      error
    );


    /*
      User cancelling Save As
      isn't treated as a scary error.
    */

    if (
      error.name ===
      "AbortError"
    ) {

      showMessage(
        "mergeMessage",
        "Save cancelled.",
        true
      );

      return;
    }


    showMessage(
      "mergeMessage",
      error.message,
      true
    );

  }

}



// ============================================================
// EXTENSION
// ============================================================

function getExtension(
  fileName
) {

  const match =
    fileName.match(
      /(\.[^\.]+)$/
    );


  if (
    !match
  ) {

    return ".bin";

  }


  return match[1];

}



// ============================================================
// UI HELPERS
// ============================================================

function updateProgress(
  number,
  percent
) {

  const element =
    document.getElementById(
      `progress-${number}`
    );


  if (
    element
  ) {

    element.style.width =
      percent + "%";

  }

}



function updatePartStatus(
  number,
  text
) {

  const element =
    document.getElementById(
      `status-${number}`
    );


  if (
    element
  ) {

    element.textContent =
      text;

  }

}



function showMessage(
  id,
  text,
  error
) {

  const element =
    document.getElementById(
      id
    );


  element.textContent =
    text;


  element.className =
    "message show " +
    (
      error
        ? "error"
        : "success"
    );

}



function formatBytes(
  bytes
) {

  if (
    bytes === 0
  ) {

    return "0 Bytes";

  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    bytes /
    Math.pow(
      1024,
      index
    )
  ).toFixed(
    2
  ) +
  " " +
  units[index];

}



function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

</script>
