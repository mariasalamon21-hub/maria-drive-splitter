<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maria Drive Splitter</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <script src="https://apis.google.com/js/api.js"></script>

  <!-- Google Picker -->
  <script src="https://apis.google.com/js/platform.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 30px 15px;

      font-family:
        Arial,
        Helvetica,

    .container {

    }

      text-align: center;
      margin-bottom: 10px;

<body>

<div class="container">

  <h1>Maria Drive Splitter</h1>

  <div class="subtitle">
    Split large files and merge them again using Google Drive
  </div>


  <!-- GOOGLE DRIVE -->

  <div class="card">

    <h2>☁️ Google Drive</h2>

    <button
      id="connectGoogleBtn"
      onclick="connectGoogle()"
    >
      Connect Google Drive
    </button>


    <div
      id="driveStatus"
      class="drive-status"
    >
      Not connected
    </div>

  </div>



  <!-- SPLIT -->

  <div class="card">

    <h2>✂️ Split File</h2>


    <input
      type="file"
      id="fileInput"
    >


    <div
      id="fileInfo"
      class="file-info"
      style="display:none;"
    ></div>


    <div class="input-row">

      <input
        type="number"
        id="partSize"
        placeholder="Part size"
        min="0.000001"
        step="any"
      >


      <select id="partUnit">

        <option value="1">
          Bit
        </option>

        <option value="8">
          Byte
        </option>

        <option value="8192">
          KB
        </option>

        <option value="8388608">
          MB
        </option>

        <option value="8589934592">
          GB
        </option>

        <option value="8796093022208">
          TB
        </option>

      </select>


      <button
        onclick="splitFile()"
      >
        Split File
      </button>

    </div>


    <div
      class="small"
    >
      Enter the size of each part.
    </div>


    <div
      id="splitMessage"
      class="message"
    ></div>


    <div
      id="partsContainer"
      class="parts"
    ></div>

  </div>



  <!-- MERGE -->

  <div class="card">

    <h2>🔗 Merge Files</h2>


    <p>
      Choose the split parts directly from Google Drive.
    </p>


    <button
      onclick="openDrivePicker()"
    >
      Choose Files from Google Drive
    </button>


    <div
      id="selectedFiles"
      style="margin-top:15px;"
    ></div>


    <div class="merge-actions">

      <button
        class="success"
        onclick="mergeSelectedFiles()"
      >
        Merge Selected Files
      </button>

    </div>

      id="mergeMessage"
      class="message"
    ></div>


    <div
      id="mergedResult"
      style="margin-top:20px;"
    ></div>

<script>


// ============================================================
// GOOGLE CONFIG
// ============================================================

const GOOGLE_CLIENT_ID =
  "304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com";


const GOOGLE_API_KEY =
  "AIzaSyDEh-aDemUgH5To39ZWVR_dFT3xis_30b4";


const DRIVE_SCOPE =
  "https://www.googleapis.com/auth/drive.file";


const GOOGLE_PROJECT_NUMBER =
  "304831987723";



// ============================================================
// GLOBAL VARIABLES
// ============================================================

let accessToken = null;

let tokenClient = null;

let pickerLoaded = false;

window.currentParts = [];

window.selectedDriveFiles = [];

window.mergedFile = null;



// ============================================================
// GOOGLE AUTH
// ============================================================

function connectGoogle() {

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    alert(
      "Google Identity Services has not loaded yet. Please wait a moment and try again."
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        GOOGLE_CLIENT_ID,

      scope:
        DRIVE_SCOPE,

      callback:
        async function(response) {

          if (
            response.error
          ) {

            console.error(
              response
            );

            showMessage(
              "splitMessage",
              "Google authorization failed.",
              true
            );

            return;
          }


          accessToken =
            response.access_token;


          document.getElementById(
            "driveStatus"
          ).textContent =
            "Connected to Google Drive";


          document.getElementById(
            "connectGoogleBtn"
          ).textContent =
            "Google Drive Connected";


          await loadPickerApi();

        }

    });


  tokenClient.requestAccessToken({
    prompt: "consent"
  });

}



// ============================================================
// LOAD PICKER
// ============================================================

function loadPickerApi() {

  return new Promise(
    function(resolve) {

      if (
        pickerLoaded
      ) {

        resolve();

        return;
      }


      gapi.load(
        "picker",
        {

          callback:
            function() {

              pickerLoaded = true;

              resolve();

            }

        }
      );

    }
  );

}



// ============================================================
// FILE INPUT
// ============================================================

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) {

        document.getElementById(
          "fileInfo"
        ).style.display =
          "none";

        return;
      }


      const size =
        formatBytes(
          file.size
        );


      const info =
        document.getElementById(
          "fileInfo"
        );


      info.style.display =
        "block";


      info.innerHTML = `
        <strong>Selected file:</strong><br>
        ${escapeHtml(file.name)}
        <br><br>
        <strong>Size:</strong>
        ${size}
      `;

    }
  );



// ============================================================
// SPLIT FILE
// ============================================================

async function splitFile() {

  const input =
    document.getElementById(
      "fileInput"
    );


  const file =
    input.files[0];


  if (!file) {

    showMessage(
      "splitMessage",
      "Please choose a file first.",
      true
    );

    return;
  }


  const sizeValue =
    parseFloat(
      document.getElementById(
        "partSize"
      ).value
    );


  if (
    !Number.isFinite(sizeValue) ||
    sizeValue <= 0
  ) {

    showMessage(
      "splitMessage",
      "Please enter a valid part size.",
      true
    );

    return;
  }


  const multiplier =
    parseFloat(
      document.getElementById(
        "partUnit"
      ).value
    );


  /*
    The Bit option is converted correctly:
    8 bits = 1 byte.
  */

  let partSize;


  if (
    multiplier === 1
  ) {

    partSize =
      sizeValue / 8;

  } else {

    partSize =
      sizeValue *
      multiplier /
      8;

  }


  /*
    The values above are based on bits.

    For Byte:
    multiplier = 8
    => value * 8 / 8 = value

    For KB:
    multiplier = 8192
    => value * 8192 / 8 = value * 1024
  */


  if (
    partSize < 1
  ) {

    showMessage(
      "splitMessage",
      "The part size is too small.",
      true
    );

    return;
  }


  if (
    partSize >= file.size
  ) {

    showMessage(
      "splitMessage",
      "The selected part size is larger than or equal to the file.",
      true
    );

  }


  window.currentParts = [];


  const partsContainer =
    document.getElementById(
      "partsContainer"
    );


  partsContainer.innerHTML =
    "";


  const totalParts =
    Math.ceil(
      file.size /
      partSize
    );


  for (
    let i = 0;
    i < totalParts;
    i++
  ) {

    const start =
      i * partSize;


    const end =
      Math.min(
        start + partSize,
        file.size
      );


    const blob =
      file.slice(
        start,
        end
      );


    const partIndex =
      i + 1;


    const partNumber =
      String(
        partIndex
      ).padStart(
        3,
        "0"
      );


    const partName =
      `${file.name}.part${partNumber}`;


    window.currentParts.push({

      name:
        partName,

      blob:
        blob,

      number:
        partIndex,

      size:
        blob.size,

      uploaded:
        false,

      driveId:
        null,

      error:
        null

    });

  }


  displayParts();


  showMessage(
    "splitMessage",
    `${totalParts} part(s) created successfully.`,
    false
  );

}



// ============================================================
// DISPLAY PARTS
// ============================================================

function displayParts() {

  const container =
    document.getElementById(
      "partsContainer"
    );


  container.innerHTML =
    "";


  if (
    !window.currentParts.length
  ) {

    return;
  }


  const uploadAllButton =
    document.createElement(
      "button"
    );


  uploadAllButton.textContent =
    "Upload All Parts to Google Drive";


  uploadAllButton.className =
    "success";


  uploadAllButton.onclick =
    uploadAllParts;


  container.appendChild(
    uploadAllButton
  );


  window.currentParts.forEach(
    function(part) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "part";


      div.id =
        `part-${part.number}`;


      div.innerHTML = `

        <div class="part-header">

          <div class="part-name">
            PART ${part.name}
          </div>

          <button
            onclick="downloadBlobPart(${part.number})"
          >
            Download
          </button>

          <button
            class="success"
            onclick="uploadPartByNumber(${part.number})"
          >
            Upload
          </button>

        </div>


        <div class="part-status">
          ${formatBytes(part.size)}
        </div>


        <div class="progress-container">

          <div
            id="progress-${part.number}"
            class="progress"
          ></div>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}



// ============================================================
// DOWNLOAD PART
// ============================================================

function downloadBlobPart(number) {

  const part =
    window.currentParts.find(
      function(p) {

        return p.number === number;

      }
    );


  if (!part) {

    return;
  }


  const url =
    URL.createObjectURL(
      part.blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    part.name;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );

}



// ============================================================
// UPLOAD ONE PART
// ============================================================

async function uploadPartByNumber(number) {

  if (!accessToken) {

    alert(
      "Connect Google Drive first."
    );

    return;
  }


  const part =
    window.currentParts.find(
      function(p) {

        return p.number === number;

      }
    );


  if (!part) {

    return;
  }


  try {

    updatePartStatus(
      number,
      "Uploading..."
    );


    const fileId =
      await uploadToDrive(
        part.blob,
        part.name,
        function(percent) {

          updateProgress(
            number,
            percent
          );

        }
      );


    part.uploaded =
      true;


    part.driveId =
      fileId;


    updatePartStatus(
      number,
      "Uploaded successfully"
    );


    updateProgress(
      number,
      100
    );


  } catch (error) {

    console.error(
      error
    );


    part.error =
      error;


    updatePartStatus(
      number,
      "Upload failed: " +
      error.message
    );

  }

}



// ============================================================
// UPLOAD ALL PARTS
// ============================================================

async function uploadAllParts() {

  if (!accessToken) {

    alert(
      "Connect Google Drive first."
    );

    return;
  }


  for (
    const part of window.currentParts
  ) {

    if (
      part.uploaded
    ) {

      continue;
    }


    await uploadPartByNumber(
      part.number
    );

  }


  alert(
    "Finished uploading all parts."
  );

}



// ============================================================
// GOOGLE DRIVE RESUMABLE UPLOAD
// ============================================================

async function uploadToDrive(
  blob,
  fileName,
  onProgress
) {

  const metadata = {

    name:
      fileName,

    mimeType:
      "application/octet-stream"

  };


  const initResponse =
    await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
      {

        method:
          "POST",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json; charset=UTF-8",

          "X-Upload-Content-Type":
            "application/octet-stream",

          "X-Upload-Content-Length":
            String(
              blob.size
            )

        },

        body:
          JSON.stringify(
            metadata
          )

      }
    );


  if (
    !initResponse.ok
  ) {

    const text =
      await initResponse.text();


    throw new Error(
      "Could not create upload session: " +
      text
    );

  }


  const uploadUrl =
    initResponse.headers.get(
      "Location"
    );


  if (!uploadUrl) {

    throw new Error(
      "Google Drive did not return an upload URL."
    );

  }


  const chunkSize =
    16 * 1024 * 1024;


  let offset = 0;


  while (
    offset < blob.size
  ) {

    const end =
      Math.min(
        offset +
        chunkSize,
        blob.size
      );


    const chunk =
      blob.slice(
        offset,
        end
      );


    let response;


    let attempts = 0;


    while (
      true
    ) {

      try {

        response =
          await fetch(
            uploadUrl,
            {

              method:
                "PUT",

              headers: {

                "Content-Length":
                  String(
                    chunk.size
                  ),

                "Content-Range":
                  `bytes ${offset}-${end - 1}/${blob.size}`

              },

              body:
                chunk

            }
          );


        if (
          response.status === 308
        ) {

          const range =
            response.headers.get(
              "Range"
            );


          if (range) {

            const match =
              range.match(
                /bytes=0-(\d+)/
              );


            if (match) {

              offset =
                Number(
                  match[1]
                ) + 1;

            } else {

              offset =
                end;

            }

          } else {

            offset =
              end;

          }


          break;

        }


        if (
          response.ok
        ) {

          offset =
            end;

          break;

        }


        if (
          response.status === 429 ||
          response.status >= 500
        ) {

          throw new Error(
            "Temporary upload error"
          );

        }


        const errorText =
          await response.text();


        throw new Error(
          errorText
        );

      } catch (
        error
      ) {

        attempts++;


        if (
          attempts >= 5
        ) {

          throw error;

        }


        await sleep(
          Math.min(
            1000 *
            Math.pow(
              2,
              attempts
            ),
            10000
          )
        );

      }

    }


    if (
      onProgress
    ) {

      const percent =
        Math.round(
          (
            offset /
            blob.size
          ) *
          100
        );


      onProgress(
        percent
      );

    }

  }


  /*
    Verify that Google Drive actually created
    the file and return its Drive ID.
  */

  const verifyUrl =
    "https://www.googleapis.com/drive/v3/files/" +
    encodeURIComponent(
      await getUploadedFileId(
        fileName
      )
    ) +
    "?fields=id,name,mimeType";


  /*
    The upload itself normally returns the file ID
    through the final response. Since some browsers
    may not expose it through the resumable loop,
    we verify by searching for the exact name.
  */

  const searchResponse =
    await fetch(
      "https://www.googleapis.com/drive/v3/files?" +
      new URLSearchParams({

        q:
          `name = '${escapeDriveQuery(fileName)}' and trashed = false`,

        fields:
          "files(id,name,mimeType,createdTime)",

        orderBy:
          "createdTime desc",

        pageSize:
          "10"

      }),
      {

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  if (
    searchResponse.ok
  ) {

    const data =
      await searchResponse.json();


    if (
      data.files &&
      data.files.length
    ) {

      return data.files[0].id;

    }

  }


  /*
    The file was uploaded even if the verification
    search did not return an ID.
  */

  return null;

}



// ============================================================
// GOOGLE DRIVE PICKER
// ============================================================

async function openDrivePicker() {

  if (!accessToken) {

    alert(
      "Connect Google Drive first."
    );

    return;
  }


  if (!GOOGLE_API_KEY) {

    alert(
      "Google API key is missing."
    );

    return;
  }


  if (!pickerLoaded) {

    await loadPickerApi();

  }


  if (!pickerLoaded) {

    alert(
      "Google Picker could not be loaded."
    );

    return;

  }


  /*
    IMPORTANT:

    There is NO setMimeTypes() here.

    This means the website does not tell
    Google Picker to show only PDF/video/etc.

    The user can browse the files available
    to this app in Google Drive.
  */

  const docsView =
    new google.picker.DocsView(
      google.picker.ViewId.DOCS
    );


  docsView.setIncludeFolders(
    false
  );


  docsView.setSelectFolderEnabled(
    false
  );


  const picker =
    new google.picker.PickerBuilder()

      .setDeveloperKey(
        GOOGLE_API_KEY
      )

      .setOAuthToken(
        accessToken
      )

      .setAppId(
        GOOGLE_PROJECT_NUMBER
      )

      .addView(
        docsView
      )

      .enableFeature(
        google.picker.Feature.MULTISELECT_ENABLED
      )

      .setCallback(
        pickerCallback
      )

      .build();


  picker.setVisible(
    true
  );

}



// ============================================================
// PICKER CALLBACK
// ============================================================

function pickerCallback(data) {

  if (
    data.action !==
    google.picker.Action.PICKED
  ) {

    return;
  }


  window.selectedDriveFiles =
    data.docs || [];


  displaySelectedDriveFiles();

}



// ============================================================
// DISPLAY SELECTED DRIVE FILES
// ============================================================

function displaySelectedDriveFiles() {

  const container =
    document.getElementById(
      "selectedFiles"
    );


  container.innerHTML =
    "";


  if (
    !window.selectedDriveFiles.length
  ) {

    container.innerHTML =
      "<p>No files selected.</p>";

    return;
  }


  const title =
    document.createElement(
      "p"
    );


  title.innerHTML =
    `<strong>${window.selectedDriveFiles.length} file(s) selected:</strong>`;


  container.appendChild(
    title
  );


  window.selectedDriveFiles.forEach(
    function(file, index) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "selected-file";


      div.innerHTML = `
        <strong>${index + 1}.</strong>
        ${escapeHtml(file.name)}
        <br>
        <span class="small">
          ${file.mimeType || "Unknown type"}
        </span>
      `;


      container.appendChild(
        div
      );

    }
  );

}



// ============================================================
// MERGE
// ============================================================

async function mergeSelectedFiles() {

  const files =
    window.selectedDriveFiles;


  if (
    !files ||
    !files.length
  ) {

    showMessage(
      "mergeMessage",
      "Please choose files from Google Drive first.",
      true
    );

    return;
  }


  try {

    showMessage(
      "mergeMessage",
      "Checking selected parts...",
      false
    );


    const partInfo =
      files.map(
        function(file) {

          return {

            file:
              file,

            number:
              getPartNumber(
                file.name
              ),

            originalName:
              getOriginalName(
                file.name
              )

          };

        }
      );


    /*
      Every selected file must have a .partXXX
      ending.
    */

    for (
      const item of partInfo
    ) {

      if (
        item.number === null
      ) {

        throw new Error(
          `"${item.file.name}" is not a valid split part.`
        );

      }

    }


    /*
      All parts must belong to the same
      original file.
    */

    const originalName =
      partInfo[0].originalName;


    for (
      const item of partInfo
    ) {

      if (
        item.originalName !==
        originalName
      ) {

        throw new Error(
          "The selected parts belong to different original files."
        );

      }

    }


    /*
      Check duplicate part numbers.
    */

    const numbers =
      partInfo.map(
        function(item) {

          return item.number;

        }
      );


    const uniqueNumbers =
      new Set(
        numbers
      );


    if (
      uniqueNumbers.size !==
      numbers.length
    ) {

      throw new Error(
        "The same part number was selected more than once."
      );

    }


    /*
      Sort numerically:
      part001
      part002
      part003
      ...
    */

    partInfo.sort(
      function(a, b) {

        return a.number -
          b.number;

      }
    );


    /*
      Make sure the sequence starts
      from part001 and has no gaps.
    */

    for (
      let i = 0;
      i < partInfo.length;
      i++
    ) {

      const expected =
        i + 1;


      if (
        partInfo[i].number !==
        expected
      ) {

        throw new Error(
          `Missing part${String(expected).padStart(3,"0")}.`
        );

      }

    }


    showMessage(
      "mergeMessage",
      "Downloading parts from Google Drive...",
      false
    );


    const blobs = [];


    for (
      let i = 0;
      i < partInfo.length;
      i++
    ) {

      const item =
        partInfo[i];


      showMessage(
        "mergeMessage",
        `Downloading ${item.file.name} (${i + 1}/${partInfo.length})...`,
        false
      );


      const blob =
        await downloadDriveFile(
          item.file.id
        );


      blobs.push(
        blob
      );

    }


    showMessage(
      "mergeMessage",
      "Merging files...",
      false
    );


    /*
      IMPORTANT:

      No compression.
      No conversion.
      No video processing.

      The blobs are simply concatenated
      byte-for-byte.
    */

    const mergedBlob =
      new Blob(
        blobs,
        {
          type:
            getMimeType(
              originalName
            )
        }
      );


    window.mergedFile = {

      blob:
        mergedBlob,

      name:
        originalName

    };


    const result =
      document.getElementById(
        "mergedResult"
      );


    result.innerHTML = `

      <div class="file-info">

        <strong>
          Merge completed successfully.
        </strong>

        <br><br>

        File:
        ${escapeHtml(originalName)}

        <br>

        Size:
        ${formatBytes(mergedBlob.size)}

        <br><br>

        <button
          class="success"
          onclick="downloadMergedFile()"
        >
          Download Merged File
        </button>

      </div>

    `;


    showMessage(
      "mergeMessage",
      "Merge completed successfully.",
      false
    );


  } catch (
    error
  ) {

    console.error(
      error
    );


    showMessage(
      "mergeMessage",
      error.message,
      true
    );

  }

}



// ============================================================
// DOWNLOAD DRIVE FILE
// ============================================================

async function downloadDriveFile(
  fileId
) {

  const response =
    await fetch(
      "https://www.googleapis.com/drive/v3/files/" +
      encodeURIComponent(
        fileId
      ) +
      "?alt=media",
      {

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  if (
    !response.ok
  ) {

    const text =
      await response.text();


    throw new Error(
      "Could not download file from Google Drive: " +
      text
    );

  }


  return await response.blob();

}



// ============================================================
// DOWNLOAD MERGED FILE
// ============================================================

function downloadMergedFile() {

  if (
    !window.mergedFile
  ) {

    return;
  }


  const url =
    URL.createObjectURL(
      window.mergedFile.blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    window.mergedFile.name;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );

}



// ============================================================
// PART NUMBER
// ============================================================

function getPartNumber(
  fileName
) {

  const match =
    fileName.match(
      /\.part(\d+)$/i
    );


  if (!match) {

    return null;

  }


  return Number(
    match[1]
  );

}



// ============================================================
// ORIGINAL FILE NAME
// ============================================================

function getOriginalName(
  fileName
) {

  return fileName.replace(
    /\.part\d+$/i,
    ""
  );

}



// ============================================================
// MIME TYPE
// ============================================================

function getMimeType(
  fileName
) {

  const extension =
    fileName
      .split(".")
      .pop()
      .toLowerCase();


  const types = {

    mp4:
      "video/mp4",

    mov:
      "video/quicktime",

    mkv:
      "video/x-matroska",

    avi:
      "video/x-msvideo",

    mp3:
      "audio/mpeg",

    wav:
      "audio/wav",

    pdf:
      "application/pdf",

    zip:
      "application/zip",

    "7z":
      "application/x-7z-compressed",

    rar:
      "application/vnd.rar",

    iso:
      "application/x-iso9660-image",

    psd:
      "image/vnd.adobe.photoshop",

    jpg:
      "image/jpeg",

    jpeg:
      "image/jpeg",

    png:
      "image/png",

    txt:
      "text/plain"

  };


  return (
    types[extension] ||
    "application/octet-stream"
  );

}

) {

  const part =

function showMessage(
  id,
  text,
  error
) {

  const element =
    document.getElementById(
      id
    );


  element.textContent =
    text;


  element.className =
    "message show " +
    (
      error
        ? "error"
        : "success"
    );

}



function formatBytes(
  bytes
) {

  if (
    bytes === 0
  ) {

    return "0 Bytes";

  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    bytes /
    Math.pow(
      1024,
      index
    )
  ).toFixed(
    2
  ) +
  " " +
  units[index];

}



function sleep(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}



function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



function escapeDriveQuery(
  text
) {

  return text.replace(
    /\\/g,
    "\\\\"
  ).replace(
    /'/g,
    "\\'"
  );

}
