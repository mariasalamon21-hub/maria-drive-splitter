<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكي البيانو بعزف الأرقام</title>
    <style>
        body {
            background-color: #1e293b;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        .container {
            background-color: #0f172a;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        button {
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #1d4ed8; }

        /* مفاتيح البيانو المرئية */
        .piano {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
        }

        .key {
            width: 40px;
            height: 140px;
            background: white;
            border: 1px solid #ccc;
            margin: 0 2px;
            border-radius: 0 0 4px 4px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            color: #333;
            font-weight: bold;
            transition: background 0.1s;
        }

        .key.playing {
            background: #60a5fa !important;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>عازف نغمات البيانو بالأرقام</h2>
    <p style="font-size: 13px; color: #94a3b8;">اكتبي الأرقام من 1 إلى 7 (مثال: 1 3 5 3 1)</p>
    
    <div class="input-group">
        <input type="text" id="notesInput" value="1 2 3 4 5 6 7" placeholder="أدخلي الأرقام هنا...">
        <button onclick="playSequence()">عزف النغمة</button>
    </div>

    <!-- مفاتيح البيانو لتوضيح النغمة المعزوفة -->
    <div class="piano">
        <div class="key" id="key-1">1</div>
        <div class="key" id="key-2">2</div>
        <div class="key" id="key-3">3</div>
        <div class="key" id="key-4">4</div>
        <div class="key" id="key-5">5</div>
        <div class="key" id="key-6">6</div>
        <div class="key" id="key-7">7</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // خريطة الترددات الصوتيّة للأرقام من 1 لـ 7 (Do Re Mi Fa Sol La Si)
    const notes = {
        '1': 261.63, // Do
        '2': 293.66, // Re
        '3': 329.63, // Mi
        '4': 349.23, // Fa
        '5': 392.00, // Sol
        '6': 440.00, // La
        '7': 493.88  // Si
    };

    function playNote(num) {
        if (!notes[num]) return;

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.value = notes[num];

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);

        // إضاءة المفتاح أثناء العزف
        const keyEl = document.getElementById(`key-${num}`);
        if (keyEl) {
            keyEl.classList.add('playing');
            setTimeout(() => keyEl.classList.remove('playing'), 300);
        }
    }

    // عزف سلسلة الأرقام ورا بعض بالترتيب
    function playSequence() {
        const input = document.getElementById('notesInput').value;
        const numbers = input.replace(/[^1-7]/g, '').split(''); // استخراج الأرقام فقط من 1 إلى 7

        numbers.forEach((num, index) => {
            setTimeout(() => {
                playNote(num);
            }, index * 400); // الفارق الزمني بين كل نغمة والتانية (400 مللي ثانية)
        });
    }
</script>

</body>
</html>
