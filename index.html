<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZArchiver Web Explorer 📁</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2a2a2a; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 18px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { color: #ffb74d; margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
    .btn { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn:hover { background: #3d3d3d; border-color: #666; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-drive { background: #1a73e8; border: none; font-weight: bold; }
    .btn-drive:hover { background: #1557b0; }
    .btn-action { background: #ffb74d; color: #121212; border: none; font-weight: bold; }
    .btn-action:hover { background: #ffa726; }
    
    .explorer-bar { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
    .file-list { background: #262626; border-radius: 10px; border: 1px solid #333; min-height: 280px; max-height: 420px; overflow-y: auto; padding: 10px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid #333; }
    .file-item:last-child { border-bottom: none; }
    .file-info { display: flex; align-items: center; gap: 12px; font-size: 15px; }
    .file-icon { font-size: 20px; }
    
    .panel { background: #252525; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #333; }
    .panel h3 { margin-top: 0; color: #64b5f6; font-size: 18px; }
    .size-group { display: flex; gap: 12px; margin: 12px 0 18px 0; }
    .size-group input { flex: 2; padding: 10px 14px; background: #333; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 15px; }
    .size-group select { flex: 1; padding: 10px 14px; background: #333; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 15px; }
    .status { margin-top: 15px; font-size: 14px; color: #81c784; padding: 10px; background: #1b2e1e; border-radius: 6px; border: 1px solid #2e4d32; display: none; }
    .status.show { display: block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ZArchiver Web Explorer 📁</h1>
    <div>
      <button class="btn btn-drive" onclick="connectGoogleDrive()">🔗 ربط Google Drive</button>
    </div>
  </header>

  <!-- شريط الأزرار المستقلة -->
  <div class="explorer-bar">
    <button class="btn" onclick="openLocalFolder()">📂 فتح مجلد الجهاز</button>
    <button class="btn btn-action" onclick="pickFileToCopy()">📋 Copy (اختيار ملف للنسخ)</button>
    <button class="btn btn-action" id="pasteBtn" onclick="pickFolderAndPaste()" disabled>📥 Paste (اختيار مكان اللصق)</button>
  </div>

  <div class="file-list" id="fileList">
    <div style="padding: 40px; text-align: center; color: #888;">استخدم الأزرار بالأعلى لفتح المجلدات أو تنفيذ عمليات النسخ واللصق</div>
  </div>

  <div class="panel">
    <h3>أدوات التقسيم والدمج</h3>
    <label style="font-size: 14px; color: #ccc;">حدد حجم التقسيم للملف:</label>
    <div class="size-group">
      <input type="number" id="chunkSize" value="500" min="0.000001" step="any" placeholder="أدخل الحجم">
      <select id="unitSelect">
        <option value="bit">بت (Bit)</option>
        <option value="B">بايت (Byte)</option>
        <option value="KB">كيلوبايت (KB)</option>
        <option value="MB" selected>ميجابايت (MB)</option>
        <option value="GB">جيجابايت (GB)</option>
        <option value="TB">تيرا بايت (TB)</option>
      </select>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button class="btn btn-action" style="flex: 1; min-width: 180px; justify-content: center;" onclick="splitSelectedFile()">تقسيم الملف</button>
      <button class="btn btn-action" style="flex: 1; min-width: 180px; justify-content: center;" onclick="mergeSelectedFiles()">دمج الأجزاء</button>
    </div>
    <div id="statusText" class="status"></div>
  </div>
</div>

<script>
  let currentDirHandle = null;
  let fileEntries = [];
  let storedFileToCopy = null;

  async function openLocalFolder() {
    try {
      currentDirHandle = await window.showDirectoryPicker();
      await refreshFileList();
      showStatus("تم فتح المجلد بنجاح!");
    } catch (err) {
      console.log('تم إلغاء اختيار المجلد');
    }
  }

  async function refreshFileList() {
    if (!currentDirHandle) return;
    const fileListDiv = document.getElementById('fileList');
    fileListDiv.innerHTML = '';
    fileEntries = [];

    for await (const entry of currentDirHandle.values()) {
      fileEntries.push(entry);
      const item = document.createElement('div');
      item.className = 'file-item';
      const icon = entry.kind === 'directory' ? '📁' : '📄';
      
      item.innerHTML = `
        <div class="file-info">
          <span class="file-icon">${icon}</span>
          <span>${entry.name}</span>
        </div>
      `;
      fileListDiv.appendChild(item);
    }
  }

  function showStatus(text) {
    const statusEl = document.getElementById('statusText');
    statusEl.innerText = text;
    statusEl.classList.add('show');
  }

  // زر Copy المستقل: يفتح نافذة لاختيار أي ملف في الجهاز لنسخه
  async function pickFileToCopy() {
    try {
      [storedFileToCopy] = await window.showOpenFilePicker();
      if (storedFileToCopy) {
        document.getElementById('pasteBtn').disabled = false;
        showStatus(`تم نسخ الملف: ${storedFileToCopy.name} بنجاح. اضغط الآن على Paste لتحديد مكان اللصق.`);
      }
    } catch (err) {
      console.log('تم إلغاء اختيار الملف للنسخ');
    }
  }

  // زر Paste المستقل: يفتح نافذة لاختيار مجلد الهدف ولصق الملف فيه
  async function pickFolderAndPaste() {
    if (!storedFileToCopy) return;
    try {
      const destinationDirHandle = await window.showDirectoryPicker();
      if (destinationDirHandle) {
        const file = await storedFileToCopy.getFile();
        const newFileHandle = await destinationDirHandle.getFileHandle(`copy_${file.name}`, { create: true });
        const writable = await newFileHandle.createWritable();
        await writable.write(file);
        await writable.close();
        
        showStatus(`تم لصق الملف بنجاح في المجلد المحدد باسم: copy_${file.name}`);
      }
    } catch (err) {
      console.log('تم إلغاء اختيار مجلد اللصق');
    }
  }

  async function splitSelectedFile() {
    if (!currentDirHandle) {
      alert("الرجاء فتح مجلد أولاً لاحتواء الملفات المقسمة!");
      return;
    }
    
    try {
      const [fileHandle] = await window.showOpenFilePicker();
      if (!fileHandle) return;
      const file = await fileHandle.getFile();
      
      const sizeValue = parseFloat(document.getElementById('chunkSize').value);
      const unit = document.getElementById('unitSelect').value;

      let chunkSizeInBytes = sizeValue;
      if (unit === 'bit') chunkSizeInBytes = sizeValue / 8;
      else if (unit === 'B') chunkSizeInBytes = sizeValue;
      else if (unit === 'KB') chunkSizeInBytes = sizeValue * 1024;
      else if (unit === 'MB') chunkSizeInBytes = sizeValue * 1024 * 1024;
      else if (unit === 'GB') chunkSizeInBytes = sizeValue * 1024 * 1024 * 1024;
      else if (unit === 'TB') chunkSizeInBytes = sizeValue * 1024 * 1024 * 1024 * 1024;

      let offset = 0;
      let partNum = 1;

      showStatus("جاري تقسيم الملف وحفظ الأجزاء داخل المجلد المفتوح...");

      while (offset < file.size) {
        const chunk = file.slice(offset, offset + chunkSizeInBytes);
        const partName = `${file.name}.part${String(partNum).padStart(3, '0')}`;
        
        const partHandle = await currentDirHandle.getFileHandle(partName, { create: true });
        const writable = await partHandle.createWritable();
        await writable.write(chunk);
        await writable.close();

        offset += chunkSizeInBytes;
        partNum++;
      }

      showStatus(`تم تقسيم الملف بنجاح إلى ${partNum - 1} أجزاء داخل المجلد!`);
      await refreshFileList();
    } catch (err) {
      console.log('تم الغاء اختيار الملف للتقسيم');
    }
  }

  async function mergeSelectedFiles() {
    if (!currentDirHandle) return alert("الرجاء فتح مجلد يحتوي على الأجزاء أولاً!");
    
    const partEntries = fileEntries.filter(e => e.kind === 'file' && /\.part\d+$/i.test(e.name));
    if (!partEntries.length) return alert("لم يتم العثور على أجزاء (.part) في المجلد المفتوح!");

    partEntries.sort((a, b) => a.name.localeCompare(b.name));
    showStatus("جاري دمج الأجزاء...");

    let originalName = partEntries[0].name.replace(/\.part\d+$/i, '');
    const mergedHandle = await currentDirHandle.getFileHandle(`merged_${originalName}`, { create: true });
    const writable = await mergedHandle.createWritable();

    for (const entry of partEntries) {
      const file = await entry.getFile();
      await writable.write(file);
    }
    await writable.close();

    showStatus(`تم دمج الأجزاء بنجاح بالملف: merged_${originalName}`);
    await refreshFileList();
  }

  function connectGoogleDrive() {
    const CLIENT_ID = '304831987723-5g9mvugqaoi8uhg6vofrjqqm77u48onh.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (response) => {
        if (response.access_token) {
          showStatus("تم الاتصال بـ Google Drive بنجاح!");
        }
      },
    });
    client.requestAccessToken();
  }
</script>

</body>
</html>
